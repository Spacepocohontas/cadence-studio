<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadence</title>
  <meta name="theme-color" content="#09090b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #09090b;
      --fg: #f4f4f5;
      --muted: #a1a1aa;
      --subtle: #71717a;
      --card: #111114;
      --elevated: #18181c;
      --border: rgba(255,255,255,0.1);
      --primary: #e4e4e7;
      --primary-fg: #09090b;
      --record: #e11d48;
      --radius: 16px;
      --font: "IBM Plex Sans", system-ui, sans-serif;
      --display: "Syne", system-ui, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .app { min-height: 100dvh; display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; padding: 12px; gap: 12px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { font-family: var(--display); font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 0.75rem; margin: 2px 0 0; }
    .seg { display: flex; background: var(--elevated); border-radius: 999px; padding: 3px; }
    .seg button { border-radius: 999px; padding: 8px 14px; font-size: 0.8rem; font-weight: 500; color: var(--muted); }
    .seg button.on { background: var(--primary); color: var(--primary-fg); }
    .grid { display: grid; gap: 12px; flex: 1; min-height: 0; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 320px; } }
    .stage-wrap { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
    .stage {
      position: relative; flex: 1; min-height: 240px; border-radius: 24px;
      background: var(--bg); box-shadow: inset 0 0 0 1px var(--border); overflow: hidden;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .rec-pill {
      position: absolute; top: 12px; left: 12px; display: none; align-items: center; gap: 8px;
      background: rgba(9,9,11,0.75); color: var(--record); font-size: 0.75rem; font-weight: 500;
      padding: 6px 12px; border-radius: 999px;
    }
    .rec-pill.on { display: flex; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--record); }
    .transport {
      background: var(--card); border-radius: 20px; padding: 12px 14px;
      box-shadow: 0 0 0 1px var(--border);
    }
    .track-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .track-name { font-family: var(--display); font-weight: 500; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bpm { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .seek-row { display: flex; align-items: center; gap: 8px; }
    .time { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); width: 36px; font-variant-numeric: tabular-nums; }
    .time.end { text-align: right; }
    input[type="range"] {
      -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 99px;
      background: rgba(255,255,255,0.12); outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--primary);
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
    .cluster { display: flex; align-items: center; gap: 4px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--fg);
    }
    .icon-btn:hover { background: var(--elevated); }
    .play {
      width: 48px; height: 48px; border-radius: 999px; background: var(--primary); color: var(--primary-fg);
      display: grid; place-items: center;
    }
    .play:active { transform: scale(0.96); }
    .vol { display: flex; align-items: center; gap: 8px; min-width: 120px; flex: 1; max-width: 180px; }
    .btn {
      height: 36px; padding: 0 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 0 1px var(--border);
    }
    .btn:hover { background: var(--elevated); }
    .btn.primary { background: var(--primary); color: var(--primary-fg); box-shadow: none; }
    .btn.record { background: var(--record); color: #fff; box-shadow: none; }
    .side {
      background: var(--card); border-radius: 24px; padding: 12px; box-shadow: 0 0 0 1px var(--border);
      display: flex; flex-direction: column; gap: 12px; min-height: 280px;
    }
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .tabs button {
      min-height: 44px; border-radius: 12px; font-size: 0.7rem; font-weight: 500; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .tabs button.on { background: var(--primary); color: var(--primary-fg); }
    .panel { flex: 1; min-height: 0; overflow: auto; }
    .upload {
      border-radius: 16px; background: var(--elevated); padding: 20px 12px; text-align: center;
      box-shadow: 0 0 0 1px var(--border); cursor: pointer;
    }
    .upload p { margin: 4px 0 0; font-size: 0.8rem; font-weight: 500; }
    .upload span { font-size: 0.7rem; color: var(--muted); }
    .list { list-style: none; margin: 10px 0 0; padding: 0; }
    .list li {
      display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; cursor: pointer;
    }
    .list li:hover, .list li.active { background: var(--elevated); }
    .list .meta { flex: 1; min-width: 0; }
    .list .name { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list .kind { font-size: 0.7rem; color: var(--muted); }
    label.field { display: block; font-size: 0.7rem; color: var(--muted); margin: 10px 0 4px; font-weight: 500; }
    textarea, input[type="text"] {
      width: 100%; background: var(--elevated); border: none; border-radius: 10px; color: var(--fg);
      padding: 10px 12px; font: inherit; font-size: 0.85rem; box-shadow: 0 0 0 1px var(--border);
      resize: vertical; min-height: 72px;
    }
    input[type="text"] { min-height: 40px; }
    .hint { font-size: 0.75rem; color: var(--muted); line-height: 1.45; margin: 0 0 8px; }
    .mod {
      background: var(--elevated); border-radius: 14px; padding: 12px; margin-bottom: 8px;
      box-shadow: 0 0 0 1px transparent; cursor: pointer;
    }
    .mod.active { box-shadow: 0 0 0 1px rgba(255,255,255,0.2); }
    .mod h3 { margin: 0; font-family: var(--display); font-size: 0.9rem; font-weight: 500; }
    .mod p { margin: 4px 0 0; font-size: 0.75rem; color: var(--muted); }
    .mix-block { background: var(--elevated); border-radius: 14px; padding: 12px; margin-bottom: 8px; }
    .mix-block h3 { margin: 0 0 10px; font-family: var(--display); font-size: 0.85rem; }
    .slider-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; }
    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--card); color: var(--fg); padding: 10px 16px; border-radius: 12px;
      font-size: 0.8rem; box-shadow: 0 0 0 1px var(--border); opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 50; max-width: 90vw;
    }
    .toast.on { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Cadence</h1>
        <p class="sub">Visualizer · DJ Studio · Music Video</p>
      </div>
      <div class="seg" id="viewSeg">
        <button type="button" data-view="player" class="on">Player</button>
        <button type="button" data-view="dj">DJ</button>
      </div>
    </header>

    <div class="grid">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <canvas id="viz"></canvas>
          <div class="rec-pill" id="recPill"><span class="dot"></span> Recording</div>
        </div>
        <div class="transport">
          <div class="track-row">
            <span class="track-name" id="trackName">Night Circuit</span>
            <span class="bpm" id="bpmLabel">124 BPM</span>
          </div>
          <div class="seek-row">
            <span class="time" id="curTime">0:00</span>
            <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
            <span class="time end" id="durTime">0:00</span>
          </div>
          <div class="controls">
            <div class="cluster">
              <button type="button" class="icon-btn" id="prevBtn" aria-label="Previous">⏮</button>
              <button type="button" class="play" id="playBtn" aria-label="Play">▶</button>
              <button type="button" class="icon-btn" id="nextBtn" aria-label="Next">⏭</button>
            </div>
            <div class="vol">
              <span style="font-size:0.75rem;color:var(--muted)">Vol</span>
              <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9" />
            </div>
            <div class="cluster">
              <button type="button" class="btn" id="snapBtn">Frame</button>
              <button type="button" class="btn" id="recBtn">Record</button>
            </div>
          </div>
        </div>
      </div>

      <aside class="side">
        <nav class="tabs" id="tabs">
          <button type="button" data-panel="library" class="on"><span>▣</span>Library</button>
          <button type="button" data-panel="mix"><span>▤</span>Mix</button>
          <button type="button" data-panel="video"><span>◈</span>Video</button>
          <button type="button" data-panel="modules"><span>◉</span>Modules</button>
        </nav>
        <div class="panel" id="panel"></div>
      </aside>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const canvas = $("viz");
    const stage = $("stage");
    const toastEl = $("toast");
    let toastTimer;

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("on");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2800);
    }

    function fmt(t) {
      if (!Number.isFinite(t) || t < 0) return "0:00";
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return m + ":" + String(s).padStart(2, "0");
    }

    const MODULES = [
      { id: "orbit", name: "Silver Orbit", desc: "Circular spectrum with cool metal rings.", mode: "orbit", trail: 0.18, sens: 0.7 },
      { id: "bars", name: "Iron Pulse", desc: "Hard bars for driving drums.", mode: "bars", trail: 0.1, sens: 0.85 },
      { id: "tunnel", name: "Night Circuit", desc: "Perspective tunnel locked to the kick.", mode: "tunnel", trail: 0.22, sens: 0.75 },
      { id: "ink", name: "Ink Bloom", desc: "Fluid orbs that swell on the downbeat.", mode: "ink", trail: 0.3, sens: 0.6 },
      { id: "horizon", name: "Glass Harbor", desc: "Soft horizon for ambient passages.", mode: "horizon", trail: 0.28, sens: 0.55 },
      { id: "stars", name: "Constellation", desc: "Nodes and lines that spark on treble.", mode: "constellation", trail: 0.24, sens: 0.65 },
    ];

    const state = {
      view: "player",
      panel: "library",
      library: [
        { id: "demo-night", name: "Night Circuit", kind: "demo", url: "synth:night", bpm: 124, builtin: true },
      ],
      active: "demo-night",
      moduleId: "orbit",
      mode: "orbit",
      trail: 0.18,
      sens: 0.7,
      auto: true,
      prompt: "",
      lyrics: "",
      plan: null,
      followPlan: true,
      master: 0.9,
      eqLow: 0, eqMid: 0, eqHigh: 0,
      filterCut: 0.7,
      delay: 0,
      recording: false,
    };

    // Audio engine
    let ctx, master, analyser, eqL, eqM, eqH, filter, delayNode, delaySend, delayFb, recordDest, source;
    let audioEl = null;
    const freq = new Uint8Array(1024);
    const timeD = new Uint8Array(1024);
    let energyHist = [];
    let beatPulse = 0;
    let lastBeat = 0;
    let bpmEst = 120;
    let mediaRecorder = null;
    let chunks = [];

    function hideEl(el) {
      el.setAttribute("aria-hidden", "true");
      el.style.cssText = "position:fixed;left:0;top:0;width:8px;height:8px;opacity:0;pointer-events:none;z-index:-1";
      if (!el.parentElement) document.body.appendChild(el);
    }

    async function ensureAudio() {
      if (ctx) {
        if (ctx.state === "suspended") await ctx.resume();
        return ctx;
      }
      ctx = new AudioContext();
      master = ctx.createGain();
      master.gain.value = state.master;
      analyser = ctx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.72;
      eqL = ctx.createBiquadFilter(); eqL.type = "lowshelf"; eqL.frequency.value = 180;
      eqM = ctx.createBiquadFilter(); eqM.type = "peaking"; eqM.frequency.value = 1200; eqM.Q.value = 0.9;
      eqH = ctx.createBiquadFilter(); eqH.type = "highshelf"; eqH.frequency.value = 6500;
      filter = ctx.createBiquadFilter(); filter.type = "lowpass"; filter.frequency.value = 22050;
      delayNode = ctx.createDelay(1.2); delayNode.delayTime.value = 0.27;
      delayFb = ctx.createGain(); delayFb.gain.value = 0.32;
      delaySend = ctx.createGain(); delaySend.gain.value = 0;
      delayNode.connect(delayFb); delayFb.connect(delayNode); delayNode.connect(master);
      recordDest = ctx.createMediaStreamDestination();
      eqL.connect(eqM); eqM.connect(eqH); eqH.connect(filter); filter.connect(master);
      filter.connect(delaySend); delaySend.connect(delayNode);
      master.connect(analyser); analyser.connect(ctx.destination); master.connect(recordDest);
      if (ctx.state === "suspended") await ctx.resume();
      return ctx;
    }

    function applyFx() {
      if (!ctx) return;
      eqL.gain.value = state.eqLow;
      eqM.gain.value = state.eqMid;
      eqH.gain.value = state.eqHigh;
      filter.frequency.value = 180 + Math.pow(state.filterCut, 1.6) * 16000;
      delaySend.gain.value = state.delay * 0.7;
      master.gain.value = state.master;
    }

    async function buildSynthDemo() {
      await ensureAudio();
      const bpm = 124, bars = 8, beat = 60 / bpm, sr = ctx.sampleRate;
      const n = Math.floor(sr * bars * 4 * beat);
      const buf = ctx.createBuffer(2, n, sr);
      const L = buf.getChannelData(0), R = buf.getChannelData(1);
      const place = (ch, start, data, g = 1) => {
        const end = Math.min(ch.length, start + data.length);
        for (let i = start; i < end; i++) ch[i] += data[i - start] * g;
      };
      const kick = (len) => {
        const d = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          const f = 140 * Math.exp(-t * 18) + 38;
          d[i] = Math.sin(2 * Math.PI * f * t) * Math.exp(-t * 6) * 1.1;
        }
        return d;
      };
      const snare = (len) => {
        const d = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          d[i] = (Math.random() * 2 - 1) * Math.exp(-t * 14) * 0.7
            + Math.sin(2 * Math.PI * 190 * t) * Math.exp(-t * 18) * 0.3;
        }
        return d;
      };
      const bass = (freq, len) => {
        const d = new Float32Array(len);
        for (let i = 0; i < len; i++) {
          const t = i / sr;
          const env = t < 0.01 ? t / 0.01 : Math.exp(-(t - 0.01) * 3);
          d[i] = Math.sin(2 * Math.PI * freq * t) * env * 0.55;
        }
        return d;
      };
      const notes = [110, 130.81, 146.83, 164.81, 110, 98, 130.81, 110];
      for (let bar = 0; bar < bars; bar++) {
        for (let bi = 0; bi < 4; bi++) {
          const t0 = Math.floor((bar * 4 + bi) * beat * sr);
          const k = kick(Math.floor(0.35 * sr));
          const g = bi === 0 || bi === 2 ? 1 : 0.55;
          place(L, t0, k, g); place(R, t0, k, g);
          if (bi === 1 || bi === 3) {
            const s = snare(Math.floor(0.28 * sr));
            place(L, t0, s, 0.8); place(R, t0, s, 0.8);
          }
          for (let h = 0; h < 4; h++) {
            const len = Math.floor(0.08 * sr);
            const hat = new Float32Array(len);
            for (let i = 0; i < len; i++) hat[i] = (Math.random() * 2 - 1) * Math.exp(-(i / sr) * 30) * 0.25;
            const off = t0 + Math.floor(h * beat * sr / 4);
            place(L, off, hat, 0.5); place(R, off, hat, 0.45);
          }
        }
        const b = bass(notes[bar % notes.length], Math.floor(0.85 * beat * sr));
        const t0 = Math.floor(bar * 4 * beat * sr);
        place(L, t0, b, 0.9); place(R, t0, b, 0.9);
      }
      let peak = 1e-6;
      for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
      for (let i = 0; i < n; i++) { L[i] *= 0.85 / peak; R[i] *= 0.85 / peak; }
      return buf;
    }

    let bufferSource = null;
    let synthBuffer = null;
    let synthStart = 0;
    let synthPausedAt = 0;
    let synthPlaying = false;

    async function loadTrack(item) {
      await ensureAudio();
      $("trackName").textContent = item.name;
      $("bpmLabel").textContent = (item.bpm || Math.round(bpmEst)) + " BPM";
      if (String(item.url).startsWith("synth:")) {
        if (!synthBuffer) synthBuffer = await buildSynthDemo();
        if (audioEl) { audioEl.pause(); }
        return;
      }
      if (!audioEl) {
        audioEl = document.createElement("audio");
        audioEl.crossOrigin = "anonymous";
        audioEl.preload = "auto";
        hideEl(audioEl);
        source = ctx.createMediaElementSource(audioEl);
        source.connect(eqL);
        audioEl.addEventListener("ended", () => { updateTransport(); });
        audioEl.addEventListener("timeupdate", () => updateTransport());
      }
      const abs = new URL(item.url, location.href).href;
      if (audioEl.src !== abs) {
        audioEl.src = item.url;
        audioEl.load();
      }
    }

    function stopSynth() {
      if (bufferSource) {
        try { bufferSource.stop(); } catch (_) {}
        bufferSource.disconnect();
        bufferSource = null;
      }
      synthPlaying = false;
    }

    async function togglePlay() {
      const item = state.library.find((x) => x.id === state.active);
      if (!item || item.kind === "image") { toast("Pick an audio track first"); return; }
      await ensureAudio();
      applyFx();
      await loadTrack(item);
      try {
        if (String(item.url).startsWith("synth:")) {
          if (synthPlaying) {
            synthPausedAt = (ctx.currentTime - synthStart) % synthBuffer.duration;
            stopSynth();
            $("playBtn").textContent = "▶";
            updateTransport();
            return;
          }
          stopSynth();
          bufferSource = ctx.createBufferSource();
          bufferSource.buffer = synthBuffer;
          bufferSource.connect(eqL);
          bufferSource.onended = () => {
            if (synthPlaying) {
              synthPlaying = false;
              synthPausedAt = 0;
              $("playBtn").textContent = "▶";
              updateTransport();
            }
          };
          const offset = synthPausedAt;
          bufferSource.start(0, offset);
          synthStart = ctx.currentTime - offset;
          synthPlaying = true;
          $("playBtn").textContent = "⏸";
          updateTransport();
          return;
        }
        if (!audioEl.paused && !audioEl.ended) {
          audioEl.pause();
          $("playBtn").textContent = "▶";
          return;
        }
        if (audioEl.readyState < 2) {
          await new Promise((res, rej) => {
            const t = setTimeout(res, 4000);
            audioEl.addEventListener("canplay", () => { clearTimeout(t); res(); }, { once: true });
            audioEl.addEventListener("error", () => { clearTimeout(t); rej(new Error("load failed")); }, { once: true });
          });
        }
        await audioEl.play();
        $("playBtn").textContent = "⏸";
      } catch (e) {
        toast(e.message || "Playback failed");
      }
    }

    function updateTransport() {
      const item = state.library.find((x) => x.id === state.active);
      if (item && String(item.url).startsWith("synth:") && synthBuffer) {
        const d = synthBuffer.duration;
        let c = synthPlaying ? (ctx.currentTime - synthStart) % d : synthPausedAt;
        if (c < 0) c = 0;
        $("curTime").textContent = fmt(c);
        $("durTime").textContent = fmt(d);
        $("seek").value = d > 0 ? Math.floor((c / d) * 1000) : 0;
        $("playBtn").textContent = synthPlaying ? "⏸" : "▶";
        $("bpmLabel").textContent = (item.bpm || Math.round(bpmEst)) + " BPM";
        return;
      }
      if (!audioEl) return;
      const d = Number.isFinite(audioEl.duration) ? audioEl.duration : 0;
      const c = audioEl.currentTime || 0;
      $("curTime").textContent = fmt(c);
      $("durTime").textContent = fmt(d);
      $("seek").value = d > 0 ? Math.floor((c / d) * 1000) : 0;
      $("playBtn").textContent = !audioEl.paused && !audioEl.ended ? "⏸" : "▶";
      $("bpmLabel").textContent = (item?.bpm || Math.round(bpmEst)) + " BPM";
    }
    setInterval(updateTransport, 250);

    function sample() {
      if (!analyser) {
        return { bass: 0.1, mid: 0.08, treble: 0.06, energy: 0.1, beat: false, beatPulse, progress: 0 };
      }
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(timeD);
      const n = freq.length;
      const band = (a, b) => {
        let s = 0; const i0 = Math.floor(a * n), i1 = Math.max(i0 + 1, Math.floor(b * n));
        for (let i = i0; i < i1; i++) s += freq[i];
        return s / ((i1 - i0) * 255);
      };
      const bass = band(0, 0.06), mid = band(0.06, 0.28), treble = band(0.28, 0.7);
      const energy = bass * 0.55 + mid * 0.3 + treble * 0.15;
      energyHist.push(energy); if (energyHist.length > 48) energyHist.shift();
      const avg = energyHist.reduce((a, b) => a + b, 0) / energyHist.length;
      const now = performance.now();
      const beat = energy > avg * 1.28 && energy > 0.18 && now - lastBeat > 180;
      if (beat) {
        lastBeat = now;
        beatPulse = 1;
        // crude bpm
        if (!sample._beats) sample._beats = [];
        sample._beats.push(now);
        if (sample._beats.length > 10) sample._beats.shift();
        if (sample._beats.length >= 4) {
          let sum = 0;
          for (let i = 1; i < sample._beats.length; i++) sum += sample._beats[i] - sample._beats[i - 1];
          const est = 60000 / (sum / (sample._beats.length - 1));
          if (est >= 70 && est <= 180) bpmEst = bpmEst * 0.7 + est * 0.3;
        }
      } else beatPulse *= 0.86;
      let d = 0, c = 0;
      if (synthPlaying && synthBuffer) {
        d = synthBuffer.duration;
        c = (ctx.currentTime - synthStart) % d;
      } else if (audioEl) {
        d = Number.isFinite(audioEl.duration) ? audioEl.duration : 0;
        c = audioEl.currentTime || 0;
      }
      return { bass, mid, treble, energy, beat, beatPulse, progress: d > 0 ? c / d : 0, freq, timeD };
    }

    // Visualizer
    const particles = Array.from({ length: 320 }, () => ({ x: 0.5, y: 0.5, vx: 0, vy: 0, life: 0, r: 1 }));
    let rot = 0, pulse = 0, t = 0;

    function hexRgb(h) {
      const s = h.replace("#", "");
      const n = parseInt(s.length === 3 ? s.split("").map((c) => c + c).join("") : s, 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }
    const PAL = ["#e4e4e7", "#a1a1aa", "#52525b"].map(hexRgb);

    function drawViz(dt) {
      const dpr = Math.min(2, devicePixelRatio || 1);
      const rect = stage.getBoundingClientRect();
      const w = Math.max(2, Math.floor(rect.width * dpr));
      const h = Math.max(2, Math.floor(rect.height * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      const c = canvas.getContext("2d");
      t += dt;
      let frame = sample();
      const playing = synthPlaying || (audioEl && !audioEl.paused && !audioEl.ended);
      if (!playing) {
        for (let i = 0; i < freq.length; i++) {
          const n = 0.5 + 0.5 * Math.sin(i * 0.035 + t * 0.8);
          freq[i] = Math.floor(50 + n * 110);
        }
        frame = { ...frame, bass: 0.12, mid: 0.1, treble: 0.08, energy: 0.14, freq, timeD };
      }
      pulse += (frame.beatPulse - pulse) * 0.25;
      rot += dt * (0.15 + frame.mid * 0.8);
      const fade = 0.12 + state.trail * 0.4;
      c.fillStyle = `rgba(9,9,11,${fade})`;
      c.fillRect(0, 0, w, h);

      // atmosphere rings
      const cx = w / 2, cy = h / 2, R = Math.min(w, h);
      for (let i = 1; i <= 3; i++) {
        c.beginPath();
        c.arc(cx, cy, R * 0.18 * i * (1 + frame.bass * 0.04), 0, Math.PI * 2);
        c.strokeStyle = `rgba(${PAL[1][0]},${PAL[1][1]},${PAL[1][2]},${0.08 + i * 0.03})`;
        c.lineWidth = 1;
        c.stroke();
      }

      let mode = state.mode;
      if (state.followPlan && state.plan && state.plan.scenes) {
        const sc = state.plan.scenes.find((s) => frame.progress >= s.at && frame.progress < s.until)
          || state.plan.scenes[state.plan.scenes.length - 1];
        if (sc) mode = sc.mode;
      } else if (state.auto) {
        if (frame.beatPulse > 0.7 && frame.bass > 0.45) mode = "bloom";
        else if (frame.energy > 0.55) mode = "tunnel";
        else if (frame.treble > 0.4) mode = "constellation";
        else if (frame.energy < 0.18) mode = "horizon";
      }

      const energy = Math.min(1, frame.energy * (0.6 + state.sens));
      const bass = Math.min(1, frame.bass * (0.5 + state.sens));

      if (mode === "bars") {
        const count = 64, gap = 2, step = Math.max(1, Math.floor(freq.length / count));
        const bw = (w - (count + 1) * gap) / count;
        for (let i = 0; i < count; i++) {
          const mag = Math.pow((freq[i * step] || 0) / 255, 1.15);
          const bh = mag * h * 0.62 * (0.75 + energy * 0.5);
          const x = gap + i * (bw + gap);
          c.fillStyle = `rgba(${PAL[i % 2][0]},${PAL[i % 2][1]},${PAL[i % 2][2]},${0.3 + mag * 0.65})`;
          c.fillRect(x, h * 0.72 - bh, Math.max(1, bw), bh);
        }
      } else if (mode === "tunnel") {
        for (let i = 0; i < 14; i++) {
          const z = (i / 14 + t * 0.15 * (0.4 + energy)) % 1;
          const s = 0.04 + z * 1.15;
          c.save(); c.translate(cx, cy); c.rotate(rot * 0.15 + i * 0.04);
          c.beginPath(); c.ellipse(0, 0, w * s * (0.55 + bass * 0.12), h * s * (0.55 + bass * 0.12), 0, 0, Math.PI * 2);
          c.strokeStyle = `rgba(${PAL[i % 2][0]},${PAL[i % 2][1]},${PAL[i % 2][2]},${0.12 + (1 - z) * 0.45})`;
          c.lineWidth = 1 + (1 - z) * 3; c.stroke(); c.restore();
        }
      } else if (mode === "ink") {
        for (let i = 0; i < 7; i++) {
          const ang = t * (0.2 + i * 0.03) + i * 1.7;
          const rad = R * (0.08 + (i % 3) * 0.05);
          const x = cx + Math.cos(ang) * w * 0.18 * (0.4 + frame.mid);
          const y = cy + Math.sin(ang * 0.8) * h * 0.16 * (0.4 + bass);
          const r = rad * (0.8 + energy * 0.8 + (frame.beat ? 0.2 : 0));
          const col = PAL[i % 2];
          const g = c.createRadialGradient(x, y, r * 0.1, x, y, r);
          g.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},0.45)`);
          g.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
          c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill();
        }
      } else if (mode === "horizon") {
        const hy = h * (0.58 - bass * 0.04);
        c.beginPath(); c.moveTo(0, h);
        const count = 80, step = Math.max(1, Math.floor(freq.length / count));
        for (let i = 0; i <= count; i++) {
          const mag = (freq[Math.min(freq.length - 1, i * step)] || 0) / 255;
          c.lineTo((i / count) * w, hy - mag * h * 0.38 * (0.7 + energy));
        }
        c.lineTo(w, h); c.closePath();
        const g = c.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, `rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},0.55)`);
        g.addColorStop(1, `rgba(${PAL[1][0]},${PAL[1][1]},${PAL[1][2]},0.08)`);
        c.fillStyle = g; c.fill();
      } else if (mode === "constellation") {
        const pts = [];
        const n = 36, step = Math.max(1, Math.floor(freq.length / n));
        for (let i = 0; i < n; i++) {
          const mag = (freq[i * step] || 0) / 255;
          const ang = (i / n) * Math.PI * 2 + rot * 0.1;
          const r = R * (0.12 + mag * 0.32);
          pts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r * 0.82, m: mag });
        }
        c.lineWidth = 1;
        for (let i = 0; i < pts.length; i++) {
          for (let j = i + 1; j < pts.length; j++) {
            const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
            if (d < R * 0.18) {
              c.strokeStyle = `rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},${0.08 + frame.treble * 0.2})`;
              c.beginPath(); c.moveTo(pts[i].x, pts[i].y); c.lineTo(pts[j].x, pts[j].y); c.stroke();
            }
          }
        }
        for (const p of pts) {
          c.fillStyle = `rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},${0.3 + p.m * 0.7})`;
          c.beginPath(); c.arc(p.x, p.y, 1.4 + p.m * 3.5, 0, Math.PI * 2); c.fill();
        }
      } else if (mode === "bloom") {
        const rays = 48, step = Math.max(1, Math.floor(freq.length / rays));
        for (let i = 0; i < rays; i++) {
          const mag = (freq[i * step] || 0) / 255;
          const ang = (i / rays) * Math.PI * 2 + rot * 0.2;
          const len = mag * R * 0.48 * (0.7 + energy);
          c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
          c.strokeStyle = `rgba(${PAL[i % 2][0]},${PAL[i % 2][1]},${PAL[i % 2][2]},${0.12 + mag * 0.5})`;
          c.lineWidth = 2 + mag * 6; c.stroke();
        }
      } else {
        // orbit
        const bins = 96, step = Math.max(1, Math.floor(freq.length / bins));
        const inner = R * (0.26 + bass * 0.06);
        const lenScale = R * 0.42 * (0.85 + energy);
        c.save(); c.translate(cx, cy); c.rotate(rot * 0.25);
        for (let i = 0; i < bins; i++) {
          const mag = (freq[i * step] || 0) / 255;
          const ang = (i / bins) * Math.PI * 2;
          const len = mag * lenScale;
          c.beginPath();
          c.moveTo(Math.cos(ang) * inner, Math.sin(ang) * inner);
          c.lineTo(Math.cos(ang) * (inner + len), Math.sin(ang) * (inner + len));
          c.strokeStyle = `rgba(${PAL[i % 3 === 0 ? 0 : 1][0]},${PAL[i % 3 === 0 ? 0 : 1][1]},${PAL[i % 3 === 0 ? 0 : 1][2]},${0.55 + mag * 0.45})`;
          c.lineWidth = 2.5 + mag * 4;
          c.stroke();
        }
        c.beginPath(); c.arc(0, 0, inner * 0.72 + pulse * 10, 0, Math.PI * 2);
        c.strokeStyle = `rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},0.8)`; c.lineWidth = 2; c.stroke();
        const g = c.createRadialGradient(0, 0, 4, 0, 0, inner * 0.7);
        g.addColorStop(0, `rgba(${PAL[0][0]},${PAL[0][1]},${PAL[0][2]},${0.2 + pulse * 0.25})`);
        g.addColorStop(1, "rgba(9,9,11,0)");
        c.fillStyle = g; c.fill();
        c.restore();
      }

      if (state.plan && state.followPlan && state.plan.message) {
        c.fillStyle = "rgba(244,244,245,0.85)";
        c.font = `500 ${Math.max(14, Math.floor(w * 0.02))}px "IBM Plex Sans", sans-serif`;
        c.textAlign = "center";
        c.fillText(state.plan.message.slice(0, 80), w / 2, h - Math.max(24, h * 0.05));
      }
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      drawViz(dt);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // UI panels
    function renderPanel() {
      const p = $("panel");
      if (state.panel === "library") {
        p.innerHTML = `
          <label class="upload" id="uploadZone">
            <input type="file" accept="audio/*,video/*,image/*" multiple hidden id="fileIn" />
            <p>Upload audio, video, stills</p>
            <span>Drop on stage or browse</span>
          </label>
          <ul class="list" id="libList"></ul>`;
        const ul = $("libList");
        state.library.forEach((item) => {
          const li = document.createElement("li");
          if (item.id === state.active) li.classList.add("active");
          li.innerHTML = `<div class="meta"><div class="name"></div><div class="kind"></div></div>`;
          li.querySelector(".name").textContent = item.name;
          li.querySelector(".kind").textContent = (item.builtin ? "Demo" : item.kind) + (item.bpm ? " · " + item.bpm + " BPM" : "");
          li.onclick = async () => {
            state.active = item.id;
            renderPanel();
            await loadTrack(item);
            updateTransport();
          };
          ul.appendChild(li);
        });
        $("fileIn").onchange = (e) => ingest(e.target.files);
      } else if (state.panel === "mix") {
        p.innerHTML = `
          <div class="mix-block">
            <h3>Deck EQ / FX</h3>
            <div class="slider-row"><span>Low</span><span id="vLow">${state.eqLow.toFixed(1)}</span></div>
            <input type="range" id="eqLow" min="-12" max="12" step="0.5" value="${state.eqLow}" />
            <div class="slider-row"><span>Mid</span><span id="vMid">${state.eqMid.toFixed(1)}</span></div>
            <input type="range" id="eqMid" min="-12" max="12" step="0.5" value="${state.eqMid}" />
            <div class="slider-row"><span>High</span><span id="vHigh">${state.eqHigh.toFixed(1)}</span></div>
            <input type="range" id="eqHigh" min="-12" max="12" step="0.5" value="${state.eqHigh}" />
            <div class="slider-row"><span>Filter</span><span id="vCut">${state.filterCut.toFixed(2)}</span></div>
            <input type="range" id="filterCut" min="0" max="1" step="0.01" value="${state.filterCut}" />
            <div class="slider-row"><span>Delay</span><span id="vDel">${state.delay.toFixed(2)}</span></div>
            <input type="range" id="delay" min="0" max="1" step="0.01" value="${state.delay}" />
          </div>
          <div class="mix-block">
            <h3>Visualizer</h3>
            <div class="slider-row"><span>Sensitivity</span><span id="vSens">${state.sens.toFixed(2)}</span></div>
            <input type="range" id="sens" min="0" max="1" step="0.01" value="${state.sens}" />
            <div class="slider-row"><span>Trail</span><span id="vTrail">${state.trail.toFixed(2)}</span></div>
            <input type="range" id="trail" min="0" max="0.5" step="0.01" value="${state.trail}" />
          </div>`;
        const bind = (id, key, label, parse = Number) => {
          $(id).oninput = (e) => {
            state[key] = parse(e.target.value);
            $(label).textContent = state[key].toFixed(key.includes("eq") ? 1 : 2);
            applyFx();
          };
        };
        bind("eqLow", "eqLow", "vLow"); bind("eqMid", "eqMid", "vMid"); bind("eqHigh", "eqHigh", "vHigh");
        bind("filterCut", "filterCut", "vCut"); bind("delay", "delay", "vDel");
        bind("sens", "sens", "vSens"); bind("trail", "trail", "vTrail");
      } else if (state.panel === "video") {
        p.innerHTML = `
          <p class="hint">Auto mode follows beats and energy. Prompted mode uses your direction. Plans transition as the track plays.</p>
          <label class="field">Direction</label>
          <textarea id="promptIn" placeholder="Midnight train through a glass city…">${state.prompt}</textarea>
          <label class="field">Lyrics or message</label>
          <textarea id="lyricsIn" placeholder="Optional">${state.lyrics}</textarea>
          <button type="button" class="btn primary" id="genBtn" style="width:100%;margin-top:10px;justify-content:center">Generate music video</button>
          <div id="planBox" style="margin-top:12px"></div>`;
        $("promptIn").oninput = (e) => { state.prompt = e.target.value; };
        $("lyricsIn").oninput = (e) => { state.lyrics = e.target.value; };
        $("genBtn").onclick = () => generatePlan();
        renderPlanBox();
      } else {
        p.innerHTML = `
          <p class="hint">Modules are visualizer looks plus sensitivity. Apply one, or generate from a prompt.</p>
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <input type="text" id="modPrompt" placeholder="Warehouse techno, fog…" style="flex:1" />
            <button type="button" class="btn primary" id="modGen">Generate</button>
          </div>
          <div id="modList"></div>`;
        $("modGen").onclick = () => {
          const q = ($("modPrompt").value || "custom pulse").trim();
          const modes = ["orbit", "bars", "tunnel", "ink", "horizon", "constellation", "bloom"];
          const mode = /tunnel|drive/.test(q) ? "tunnel" : /star|space/.test(q) ? "constellation" : /ink|fluid/.test(q) ? "ink" : /bar|club/.test(q) ? "bars" : modes[Math.floor(Math.random() * modes.length)];
          const m = { id: "gen-" + Date.now(), name: q.slice(0, 28), desc: "Generated from your prompt.", mode, trail: 0.2, sens: 0.75 };
          MODULES.unshift(m);
          applyModule(m);
          toast("Module “" + m.name + "” applied");
          renderPanel();
        };
        const list = $("modList");
        MODULES.forEach((m) => {
          const d = document.createElement("div");
          d.className = "mod" + (m.id === state.moduleId ? " active" : "");
          d.innerHTML = `<h3></h3><p></p>`;
          d.querySelector("h3").textContent = m.name;
          d.querySelector("p").textContent = m.desc;
          d.onclick = () => { applyModule(m); renderPanel(); };
          list.appendChild(d);
        });
      }
    }

    function applyModule(m) {
      state.moduleId = m.id;
      state.mode = m.mode;
      state.trail = m.trail;
      state.sens = m.sens;
      state.auto = false;
    }

    function renderPlanBox() {
      const box = $("planBox");
      if (!box) return;
      if (!state.plan) {
        box.innerHTML = `<p class="hint">No plan yet. Play a track and generate — or leave auto visuals on.</p>`;
        return;
      }
      box.innerHTML = `<div class="mix-block"><h3></h3><p class="hint" style="margin:6px 0"></p><ol style="margin:0;padding-left:18px;font-size:0.75rem;color:var(--muted)"></ol></div>`;
      box.querySelector("h3").textContent = state.plan.title;
      box.querySelector("p").textContent = state.plan.message;
      const ol = box.querySelector("ol");
      state.plan.scenes.forEach((s) => {
        const li = document.createElement("li");
        li.textContent = s.mode + " · " + Math.round(s.at * 100) + "–" + Math.round(s.until * 100) + "%";
        ol.appendChild(li);
      });
    }

    function generatePlan() {
      const text = (state.prompt + " " + state.lyrics).toLowerCase();
      const modes = [];
      if (/tunnel|drive/.test(text)) modes.push("tunnel");
      if (/star|space/.test(text)) modes.push("constellation");
      if (/ink|fluid|bloom/.test(text)) modes.push("ink", "bloom");
      if (/bar|club|drop/.test(text)) modes.push("bars");
      if (!modes.length) modes.push("orbit", "horizon", "tunnel", "ink", "bloom");
      const item = state.library.find((x) => x.id === state.active);
      const message = state.prompt.trim() || state.lyrics.trim().slice(0, 120)
        || ("A visual reading of " + (item?.name || "the mix") + " — form follows the beat.");
      const scenes = modes.slice(0, 5).map((mode, i, arr) => ({
        at: i / arr.length,
        until: (i + 1) / arr.length,
        mode,
      }));
      state.plan = { title: item?.name || "Untitled", message, scenes };
      state.followPlan = true;
      toast("Scene plan is live");
      renderPlanBox();
    }

    function ingest(files) {
      if (!files?.length) return;
      Array.from(files).forEach((f) => {
        const url = URL.createObjectURL(f);
        const kind = f.type.startsWith("video/") ? "video" : f.type.startsWith("image/") ? "image" : "audio";
        const item = { id: "u-" + Math.random().toString(36).slice(2, 8), name: f.name.replace(/\.[^.]+$/, ""), kind, url };
        state.library.push(item);
        if (kind !== "image") state.active = item.id;
      });
      toast("Added " + files.length + " file" + (files.length > 1 ? "s" : ""));
      renderPanel();
      const item = state.library.find((x) => x.id === state.active);
      if (item && item.kind !== "image") loadTrack(item);
    }

    // Record
    $("recBtn").onclick = async () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        return;
      }
      await ensureAudio();
      applyFx();
      const stream = new MediaStream([
        ...canvas.captureStream(30).getVideoTracks(),
        ...recordDest.stream.getAudioTracks(),
      ]);
      chunks = [];
      const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus")
        ? "video/webm;codecs=vp9,opus" : "video/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 3500000 });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: mime });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = (state.library.find((x) => x.id === state.active)?.name || "cadence").replace(/\s+/g, "-") + "-viz.webm";
        a.click();
        state.recording = false;
        $("recPill").classList.remove("on");
        $("recBtn").textContent = "Record";
        $("recBtn").classList.remove("record");
        toast("Visualization saved");
      };
      mediaRecorder.start(250);
      state.recording = true;
      $("recPill").classList.add("on");
      $("recBtn").textContent = "Stop";
      $("recBtn").classList.add("record");
      toast("Recording the stage and mix");
    };

    $("snapBtn").onclick = () => {
      canvas.toBlob((blob) => {
        if (!blob) return;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "cadence-frame.png";
        a.click();
        toast("Frame saved");
      }, "image/png");
    };

    $("playBtn").onclick = () => togglePlay();
    $("vol").oninput = (e) => { state.master = Number(e.target.value); applyFx(); };
    $("seek").oninput = (e) => {
      if (!audioEl || !Number.isFinite(audioEl.duration)) return;
      audioEl.currentTime = (Number(e.target.value) / 1000) * audioEl.duration;
    };
    $("prevBtn").onclick = $("nextBtn").onclick = (e) => {
      const playable = state.library.filter((x) => x.kind !== "image");
      const idx = playable.findIndex((x) => x.id === state.active);
      const dir = e.currentTarget.id === "nextBtn" ? 1 : -1;
      const next = playable[(idx + dir + playable.length) % playable.length];
      if (next) {
        state.active = next.id;
        loadTrack(next).then(() => {
          if (audioEl && !audioEl.paused) audioEl.play();
          updateTransport();
          renderPanel();
        });
      }
    };

    document.querySelectorAll("#viewSeg button").forEach((b) => {
      b.onclick = () => {
        state.view = b.dataset.view;
        document.querySelectorAll("#viewSeg button").forEach((x) => x.classList.toggle("on", x === b));
        toast(state.view === "dj" ? "DJ mode — mix panel for EQ & FX" : "Player mode");
        if (state.view === "dj") {
          state.panel = "mix";
          document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x.dataset.panel === "mix"));
          renderPanel();
        }
      };
    });
    document.querySelectorAll("#tabs button").forEach((b) => {
      b.onclick = () => {
        state.panel = b.dataset.panel;
        document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b));
        renderPanel();
      };
    });

    stage.addEventListener("dragover", (e) => e.preventDefault());
    stage.addEventListener("drop", (e) => { e.preventDefault(); ingest(e.dataTransfer.files); });

    // Preload demo
    loadTrack(state.library[0]).catch(() => {});
    renderPanel();
    updateTransport();
  })();
  </script>
</body>
</html>

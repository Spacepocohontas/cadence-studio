<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080c"><title>Cadence Studio v2</title><link rel="stylesheet" href="/cadence-v2.css"></head><body><main class="app"><header class="top"><div><div class="brand">CADENCE STUDIO</div><div class="muted">Media Visualizer · DJ Player · Local Library</div></div><div class="pill">LOCAL-FIRST</div></header><section id="stage" class="stage"><video id="video" playsinline></video><canvas id="viz"></canvas><div id="empty" class="empty"><div><h2>Drop your music or video into Cadence</h2><p class="muted">Choose Audio, Video, or Image so Safari opens the right picker.</p></div></div></section><section class="panel"><div class="toolbar"><button class="btn" id="addAudio">🎵 Add Audio</button><button class="btn" id="addVideo">🎬 Add Video</button><button class="btn" id="addImage">🖼️ Add Image</button><input id="audioFiles" type="file" accept="audio/mpeg,audio/mp4,audio/wav,audio/wave,audio/x-wav,audio/aac,audio/ogg,audio/webm,audio/flac,.mp3,.m4a,.wav,.aac,.ogg,.opus,.flac" multiple hidden><input id="videoFiles" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-m4v,.mp4,.mov,.m4v,.webm" multiple hidden><input id="imageFiles" type="file" accept="image/*" multiple hidden><button class="btn" id="play">▶ Play / Pause</button><button class="btn" id="mute">🔇 Mute</button><button class="btn" id="full">⛶ Fullscreen</button><button class="btn" id="shuffle">🔀 Shuffle</button><button class="btn" id="repeat">🔁 Repeat: Off</button><button class="btn" id="record">⏺ Record</button></div><div class="row" style="margin-top:10px"><button class="btn" id="onlyViz">Visualizer</button><button class="btn" id="onlyVideo">Video</button><button class="btn" id="combo">Combo Overlay</button><label class="muted">Hue <input class="range" id="hue" type="range" min="0" max="360" value="290"></label><button class="btn" id="clear">Clear local library</button></div></section><section class="panel"><audio id="audio" controls style="width:100%"></audio><div id="status" class="status">Loading local library…</div><div id="mediaList" class="mediaList"></div></section></main><script src="/cadence-v2.js"></script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadence DJ Studio</title><style>body{margin:0;background:#08080c;color:#fff;font-family:system-ui;padding:12px}.wrap{max-width:1200px;margin:auto}.decks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.deck,.mix{background:#14141b;border:1px solid #292932;border-radius:16px;padding:14px}.deck h2{margin:0 0 8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,label{background:#1c1c25;color:#fff;border:1px solid #383844;border-radius:10px;padding:9px 12px;cursor:pointer}input[type=file]{display:none}.track{font-size:13px;opacity:.7;min-height:20px}.range{width:100%}.xf{width:100%}.back{display:inline-block;color:#fff;margin-bottom:12px}@media(max-width:700px){.decks{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a class="back" href="/">← Cadence</a><h1>🎛️ Cadence DJ Studio</h1><div class="decks"><section class="deck"><h2>Deck A</h2><label>🎵 Load A<input id="fa" type="file" accept="audio/*"></label><div id="na" class="track">No track loaded</div><audio id="a" controls style="width:100%"></audio><div class="row"><button id="pa">▶ Play</button><button id="ma">🔇 Mute</button></div><label>Volume <input id="va" class="range" type="range" min="0" max="1" step=".01" value="1"></label></section><section class="deck"><h2>Deck B</h2><label>🎵 Load B<input id="fb" type="file" accept="audio/*"></label><div id="nb" class="track">No track loaded</div><audio id="b" controls style="width:100%"></audio><div class="row"><button id="pb">▶ Play</button><button id="mb">🔇 Mute</button></div><label>Volume <input id="vb" class="range" type="range" min="0" max="1" step=".01" value="1"></label></section></div><section class="mix"><h2>Crossfader</h2><input id="xf" class="xf" type="range" min="0" max="1" step=".01" value=".5"><div class="row"><button id="sync">↔ Sync volumes</button><button id="stop">■ Stop both</button><button id="repeat">🔁 Repeat off</button></div><p id="status">Load two tracks to start mixing.</p></section></main><script>const $=s=>document.querySelector(s),a=$('#a'),b=$('#b'),state={repeat:false};function load(input,el,name){input.onchange=()=>{let f=input.files[0];if(!f)return;el.src=URL.createObjectURL(f);$(name).textContent=f.name;$('#status').textContent='Loaded '+f.name}}load($('#fa'),a,'#na');load($('#fb'),b,'#nb');[['#pa',a],['#pb',b]].forEach(([id,e])=>$(id).onclick=()=>e.paused?e.play():e.pause());[['#ma',a],['#mb',b]].forEach(([id,e])=>$(id).onclick=()=>{e.muted=!e.muted;$(id).textContent=e.muted?'🔊 Unmute':'🔇 Mute'});[['#va',a],['#vb',b]].forEach(([id,e])=>$(id).oninput=x=>e.volume=+x.target.value);$('#xf').oninput=e=>{let v=+e.target.value;a.volume=1-v;b.volume=v};$('#sync').onclick=()=>{let v=(a.volume+b.volume)/2;a.volume=b.volume=v;$('#va').value=$('#vb').value=v};$('#stop').onclick=()=>{a.pause();b.pause();a.currentTime=b.currentTime=0};$('#repeat').onclick=()=>{state.repeat=!state.repeat;a.loop=b.loop=state.repeat;$('#repeat').textContent='🔁 Repeat '+(state.repeat?'on':'off')};</script></body></html>

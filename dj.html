<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080c"><title>Cadence DJ Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font-family:system-ui,-apple-system,sans-serif;padding:12px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.decks{display:grid;grid-template-columns:1fr 1fr;gap:12px}.deck,.mix{background:#14141b;border:1px solid #292932;border-radius:16px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,.fileBtn{background:#1c1c25;color:#fff;border:1px solid #383844;border-radius:10px;padding:10px 13px;cursor:pointer}.btn:active,.fileBtn:active{transform:scale(.98)}input[type=file]{display:none}.track{font-size:13px;opacity:.7;min-height:22px;margin:8px 0}.range{width:100%}.back{color:#fff;text-decoration:none}.meter{height:10px;background:#09090d;border-radius:20px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:#fff;transition:width .05s}.status{opacity:.7;min-height:20px}@media(max-width:700px){.decks{grid-template-columns:1fr}body{padding:8px}}</style></head><body><main class="wrap"><header class="top"><div><a class="back" href="/">← Cadence</a><h1>🎛️ Cadence DJ Studio</h1></div><button class="btn" id="fs">⛶ Fullscreen</button></header><div class="decks"><section class="deck"><h2>Deck A</h2><label class="fileBtn">🎵 Load A<input id="fa" type="file" accept="audio/*"></label><div id="na" class="track">No track loaded</div><audio id="a" controls preload="metadata" style="width:100%"></audio><div class="meter"><div id="ba" class="bar"></div></div><div class="row"><button class="btn" id="pa">▶ Play</button><button class="btn" id="ma">🔇 Mute</button></div><label>Volume <input id="va" class="range" type="range" min="0" max="1" step=".01" value="1"></label></section><section class="deck"><h2>Deck B</h2><label class="fileBtn">🎵 Load B<input id="fb" type="file" accept="audio/*"></label><div id="nb" class="track">No track loaded</div><audio id="b" controls preload="metadata" style="width:100%"></audio><div class="meter"><div id="bb" class="bar"></div></div><div class="row"><button class="btn" id="pb">▶ Play</button><button class="btn" id="mb">🔇 Mute</button></div><label>Volume <input id="vb" class="range" type="range" min="0" max="1" step=".01" value="1"></label></section></div><section class="mix"><h2>Crossfader</h2><input id="xf" class="range" type="range" min="0" max="1" step=".01" value=".5"><div class="row"><button class="btn" id="sync">↔ Sync</button><button class="btn" id="stop">■ Stop Both</button><button class="btn" id="repeat">🔁 Repeat Off</button></div><p id="status" class="status">Load a track on either deck.</p></section></main><script>(()=>{const $=s=>document.querySelector(s);const decks=[{a:$('#a'),file:$('#fa'),name:$('#na'),play:$('#pa'),mute:$('#ma'),vol:$('#va'),bar:$('#ba')},{a:$('#b'),file:$('#fb'),name:$('#nb'),play:$('#pb'),mute:$('#mb'),vol:$('#vb'),bar:$('#bb')}];const status=$('#status');let repeat=false;const say=t=>status.textContent=t;decks.forEach(d=>{d.a.volume=+d.vol.value;d.file.addEventListener('change',()=>{const f=d.file.files&&d.file.files[0];if(!f)return;if(d.a.src.startsWith('blob:'))URL.revokeObjectURL(d.a.src);d.a.src=URL.createObjectURL(f);d.a.load();d.name.textContent=f.name;say('Loaded '+f.name)});d.play.addEventListener('click',async()=>{if(!d.a.src){say('Load a track first.');return}try{if(d.a.paused){await d.a.play();d.play.textContent='⏸ Pause'}else{d.a.pause();d.play.textContent='▶ Play'}}catch(e){say('Tap Play again to allow playback.')}});d.a.addEventListener('play',()=>d.play.textContent='⏸ Pause');d.a.addEventListener('pause',()=>d.play.textContent='▶ Play');d.mute.addEventListener('click',()=>{d.a.muted=!d.a.muted;d.mute.textContent=d.a.muted?'🔊 Unmute':'🔇 Mute'});d.vol.addEventListener('input',()=>{d.a.volume=+d.vol.value;applyFade()});d.a.addEventListener('timeupdate',()=>{d.bar.style.width=d.a.duration?((d.a.currentTime/d.a.duration)*100)+'%':'0%'});d.a.addEventListener('ended',()=>{if(!repeat)d.play.textContent='▶ Play'})});function applyFade(){const v=+$('#xf').value;decks[0].a.volume=Math.max(0,Math.min(1,(1-v)));decks[1].a.volume=Math.max(0,Math.min(1,v));decks[0].vol.value=decks[0].a.volume;decks[1].vol.value=decks[1].a.volume}$('#xf').addEventListener('input',applyFade);$('#sync').addEventListener('click',()=>{const v=(decks[0].a.volume+decks[1].a.volume)/2;decks.forEach(d=>{d.a.volume=v;d.vol.value=v});$('#xf').value=.5;say('Deck volumes synced.')});$('#stop').addEventListener('click',()=>decks.forEach(d=>{d.a.pause();d.a.currentTime=0}));$('#repeat').addEventListener('click',()=>{repeat=!repeat;decks.forEach(d=>d.a.loop=repeat);$('#repeat').textContent='🔁 Repeat '+(repeat?'On':'Off')});$('#fs').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{say('Fullscreen is unavailable in this browser.')}});applyFade();})();</script></body></html>

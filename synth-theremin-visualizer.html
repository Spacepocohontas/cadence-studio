<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadence — Synth • Theremin • Visualizer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080d;color:#eee;font:14px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.12em}.muted{color:#92929e}.tabs{display:flex;gap:6px;margin:12px 0}.tabs button,.btn{background:#181821;color:#eee;border:1px solid #343441;border-radius:10px;padding:9px 12px;cursor:pointer}.tabs .on,.accent{background:#d946ef;color:#fff;border-color:#d946ef}.panel{display:none}.panel.on{display:block}.card{background:#111118;border:1px solid #292934;border-radius:16px;padding:14px;margin:10px 0}.controls{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px}.control label{display:block;color:#aaa;font-size:12px}.control input,.control select{width:100%}input,select{margin-top:5px;background:#0b0b10;color:#eee;border:1px solid #30303a;border-radius:8px;padding:7px}.keys{position:relative;height:220px;display:flex;touch-action:none;user-select:none}.key{flex:1;background:#eee;color:#111;border:1px solid #777;border-radius:0 0 8px 8px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px;cursor:pointer}.key.black{position:relative;margin:0 -18px;width:36px;flex:0 0 36px;height:135px;background:#111;color:#fff;z-index:2;border-color:#555}.key.down{filter:brightness(1.5);box-shadow:inset 0 -10px 20px #d946ef}.theremin{height:440px;border:1px solid #363642;border-radius:18px;position:relative;overflow:hidden;background:radial-gradient(circle at center,#252033,#08080d);touch-action:none;cursor:crosshair}.guide{position:absolute;inset:15%;border:1px dashed #666;border-radius:50%}.cross{position:absolute;width:20px;height:20px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.readout{position:absolute;top:15px;left:15px;font-size:18px;font-weight:800}.viz{height:420px;background:#020205;border-radius:18px;overflow:hidden}.viz canvas{width:100%;height:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hide{display:none}@media(max-width:700px){.controls{grid-template-columns:1fr 1fr}.keys{height:180px}.theremin{height:360px}}
</style></head><body><main>
<header class="top"><div><div class="brand">CADENCE</div><div class="muted">SYNTH • THEREMIN • VISUALIZER</div></div><span id="status" class="muted">Click Start Audio to enable sound</span></header>
<nav class="tabs"><button class="on" data-tab="synth">Synth Keyboard</button><button data-tab="theremin">Theremin</button><button data-tab="visualizer">Visualizer</button></nav>

<section id="synth" class="panel on">
<div class="card"><div class="row"><button id="start" class="btn accent">▶ Start Audio</button><button id="octDown" class="btn">Oct −</button><b id="oct">0</b><button id="octUp" class="btn">Oct +</button><button id="panic" class="btn">All Notes Off</button></div></div>
<div class="card"><div class="controls">
<div class="control"><label>Waveform</label><select id="wave"><option>sine</option><option selected>triangle</option><option>sawtooth</option><option>square</option></select></div>
<div class="control"><label>Volume</label><input id="vol" type="range" min="0" max="1" step=".01" value=".35"></div>
<div class="control"><label>Filter cutoff</label><input id="cut" type="range" min="100" max="12000" value="5000"></div>
<div class="control"><label>Resonance</label><input id="res" type="range" min=".1" max="20" step=".1" value="1"></div>
<div class="control"><label>Attack</label><input id="attack" type="range" min=".005" max="1" step=".005" value=".02"></div>
<div class="control"><label>Decay</label><input id="decay" type="range" min=".02" max="1" step=".01" value=".15"></div>
<div class="control"><label>Sustain</label><input id="sustain" type="range" min="0" max="1" step=".01" value=".65"></div>
<div class="control"><label>Release</label><input id="release" type="range" min=".02" max="2" step=".01" value=".25"></div>
</div></div>
<div class="card"><div id="keys" class="keys"></div><div class="muted">Computer mapping: A W S E D F T G Y H U J K • Z/X octave</div></div>
<div class="card"><canvas id="scope" height="110" style="width:100%;height:110px"></canvas></div>
</section>

<section id="theremin" class="panel">
<div class="card"><div class="row"><button id="therStart" class="btn accent">▶ Start Theremin</button><button id="therMute" class="btn">🔊 Mute</button><label>Wave <select id="therWave"><option>sine</option><option>triangle</option><option>sawtooth</option><option>square</option></select></label><label>Reverb <input id="reverb" type="range" min="0" max="1" step=".01" value=".25"></label></div></div>
<div id="thereminPad" class="theremin"><div class="guide"></div><div id="cross" class="cross"></div><div id="pitchRead" class="readout">Move across the field to play</div></div>
<div class="card muted">X = pitch • Y = volume. Move the pointer/finger around the field after starting audio.</div>
</section>

<section id="visualizer" class="panel">
<div class="card"><div class="row"><button id="fileBtn" class="btn accent">＋ Upload Track</button><button id="mic" class="btn">🎙 Microphone</button><button id="playFile" class="btn">▶ Play/Pause</button><button id="fs" class="btn">⛶ Fullscreen</button><label>Sensitivity <input id="sens" type="range" min=".2" max="3" step=".01" value="1"></label><label>Mode <select id="vMode"><option>bars</option><option>circular</option><option>wave</option></select></label><label>Theme <select id="theme"><option value="pink">Pink</option><option value="cyan">Cyan</option><option value="fire">Fire</option><option value="mono">Mono</option></select></label></div></div>
<div id="viz" class="viz"><canvas id="vc"></canvas></div><input id="file" class="hide" type="file" accept="audio/*"></section>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let ctx,master,analyser,scope,started=false,oct=0,voices=new Map(),therOsc,therGain,therFilter,therOn=false,therMuted=false,fileAudio,fileSource;
const keyNotes=[['A',60],['W',61],['S',62],['E',63],['D',64],['F',65],['T',66],['G',67],['Y',68],['H',69],['U',70],['J',71],['K',72]];
function init(){ctx=ctx||new AudioContext();if(ctx.state==='suspended')ctx.resume();if(!master){master=ctx.createGain();master.gain.value=+$('vol').value;analyser=ctx.createAnalyser();analyser.fftSize=2048;master.connect(analyser);analyser.connect(ctx.destination)}started=true;$('status').textContent='Audio ready';$('start').textContent='✓ Audio Ready'}$('start').onclick=init;
function midiFreq(m){return 440*Math.pow(2,(m-69)/12)}
function noteOn(m,key){init();if(voices.has(key))return;const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.type=$('wave').value;o.frequency.value=midiFreq(m+oct*12);f.type='lowpass';f.frequency.value=+$('cut').value;f.Q.value=+$('res').value;g.gain.setValueAtTime(0,ctx.currentTime);g.gain.linearRampToValueAtTime(.8,ctx.currentTime+$('attack').value);g.gain.linearRampToValueAtTime(.8*+$('sustain').value,ctx.currentTime+$('attack').value+$('decay').value);o.connect(f);f.connect(g);g.connect(master);o.start();voices.set(key,{o,g,f});document.querySelector('[data-key="'+key+'"]')?.classList.add('down')}
function noteOff(key){const v=voices.get(key);if(!v)return;const t=ctx.currentTime,r=+$('release').value;v.g.cancelScheduledValues(t);v.g.setValueAtTime(v.g.gain.value,t);v.g.gain.exponentialRampToValueAtTime(.0001,t+r);v.o.stop(t+r+.03);voices.delete(key);document.querySelector('[data-key="'+key+'"]')?.classList.remove('down')}
keyNotes.forEach(([k,m])=>{const b=document.createElement('div');b.className='key';b.dataset.key=k;b.textContent=k;b.dataset.m=m;$('keys').appendChild(b)});
[['W',61],['E',63],['T',66],['Y',68],['U',70]].forEach(([k,m])=>{const b=document.querySelector('[data-key="'+k+'"]');b.classList.add('black');b.dataset.m=m});
function keyStart(k){const x=keyNotes.find(a=>a[0]===k.toUpperCase());if(x)noteOn(x[1],x[0])}function keyEnd(k){noteOff(k.toUpperCase())}
document.querySelectorAll('.key').forEach(b=>{b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keyStart(b.dataset.key)};b.onpointerup=()=>keyEnd(b.dataset.key);b.onpointerleave=()=>{if(b.matches(':active'))keyEnd(b.dataset.key)}})
addEventListener('keydown',e=>{if(e.repeat)return;keyStart(e.key);if(e.key.toLowerCase()==='z'){$('octDown').click()}if(e.key.toLowerCase()==='x'){$('octUp').click()}});addEventListener('keyup',e=>keyEnd(e.key));$('octDown').onclick=()=>{oct=Math.max(-3,oct-1);$('oct').textContent=oct};$('octUp').onclick=()=>{oct=Math.min(3,oct+1);$('oct').textContent=oct};$('panic').onclick=()=>[...voices.keys()].forEach(noteOff);
$('vol').oninput=e=>{if(master)master.gain.value=+e.target.value};$('cut').oninput=e=>voices.forEach(v=>v.f.frequency.value=+e.target.value);$('res').oninput=e=>voices.forEach(v=>v.f.Q.value=+e.target.value);

function therInit(){init();if(therOsc)return;therOsc=ctx.createOscillator();therGain=ctx.createGain();therFilter=ctx.createBiquadFilter();therOsc.type=$('therWave').value;therFilter.type='lowpass';therFilter.frequency.value=9000;therGain.gain.value=0;therOsc.connect(therFilter);therFilter.connect(therGain);therGain.connect(master);therOsc.start();therOn=true}
$('therStart').onclick=()=>{therInit();$('pitchRead').textContent='Move to play'};
$('therWave').onchange=e=>{if(therOsc)therOsc.type=e.target.value};$('therMute').onclick=()=>{therMuted=!therMuted;$('therMute').textContent=therMuted?'🔇 Muted':'🔊 Mute'};
$('thereminPad').addEventListener('pointermove',e=>{if(!therOn)return;const r=$('thereminPad').getBoundingClientRect(),x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));const hz=80*Math.pow(2,x*5.7),gain=therMuted?0:Math.pow(1-y,1.6)*.55;therOsc.frequency.setTargetAtTime(hz,ctx.currentTime,.015);therGain.gain.setTargetAtTime(gain,ctx.currentTime,.02);$('cross').style.left=(x*100)+'%';$('cross').style.top=(y*100)+'%';$('pitchRead').textContent=hz.toFixed(1)+' Hz';});
$('thereminPad').addEventListener('pointerleave',()=>{if(therGain)therGain.gain.setTargetAtTime(0,ctx.currentTime,.04)});

const vc=$('vc'),vctx=vc.getContext('2d');function resize(){vc.width=$('viz').clientWidth*devicePixelRatio;vc.height=$('viz').clientHeight*devicePixelRatio;vctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function vizLoop(){requestAnimationFrame(vizLoop);const w=$('viz').clientWidth,h=$('viz').clientHeight;vctx.clearRect(0,0,w,h);if(!analyser)return;const a=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(a);const sens=+$('sens').value;const mode=$('vMode').value;const theme=$('theme').value;let fill=theme==='cyan'?'#22d3ee':theme==='fire'?'#f97316':theme==='mono'?'#fff':'#d946ef';vctx.strokeStyle=fill;vctx.fillStyle=fill;vctx.lineWidth=2;if(mode==='circular'){const cx=w/2,cy=h/2,max=Math.min(w,h)*.38;for(let i=0;i<80;i++){const ang=i*Math.PI*2/80,r=max*(.35+a[i]/255*sens);vctx.beginPath();vctx.arc(cx+Math.cos(ang)*r,cy+Math.sin(ang)*r,3+a[i]/80,0,Math.PI*2);vctx.fill()}}else if(mode==='wave'){vctx.beginPath();for(let i=0;i<Math.min(600,a.length);i++){const x=i/600*w,y=h/2+(a[i]/255-.5)*h*.8*sens;i?vctx.lineTo(x,y):vctx.moveTo(x,y)}vctx.stroke()}else{const n=70,bw=w/n;for(let i=0;i<n;i++){const v=a[Math.floor(i*a.length/n)]/255;vctx.fillRect(i*bw,h-v*h*v*sens,bw-2,v*h*v*sens)}}}vizLoop();
$('fileBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;init();if(fileAudio)fileAudio.pause();fileAudio=new Audio(URL.createObjectURL(f));fileAudio.crossOrigin='anonymous';fileSource=ctx.createMediaElementSource(fileAudio);fileSource.connect(master);fileAudio.onloadedmetadata=()=>fileAudio.play().catch(()=>{});$('status').textContent=f.name};$('playFile').onclick=()=>{init();if(fileAudio)fileAudio.paused?fileAudio.play():fileAudio.pause()};$('mic').onclick=async()=>{init();const stream=await navigator.mediaDevices.getUserMedia({audio:true});const src=ctx.createMediaStreamSource(stream);src.connect(analyser);$('status').textContent='Microphone visualizer active'};$('fs').onclick=()=>document.documentElement.requestFullscreen?.();
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab))});
function scopeLoop(){requestAnimationFrame(scopeLoop);if(!analyser)return;scope=$('scope');const c=scope.getContext('2d'),w=scope.clientWidth,h=scope.height;c.clearRect(0,0,w,h);const a=new Uint8Array(analyser.fftSize);analyser.getByteTimeDomainData(a);c.beginPath();for(let i=0;i<a.length;i++){const x=i/a.length*w,y=h/2+(a[i]-128)*h/256;i?c.lineTo(x,y):c.moveTo(x,y)}c.strokeStyle='#22d3ee';c.stroke()}scopeLoop();
})();
</script></body></html>

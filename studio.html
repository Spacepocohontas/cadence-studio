</style></head><body><div class="app"><header class="top"><div><div class="brand">CADENCE STUDIO</div><div class="sub">Media Visualizer · DJ · Music Video Composer</div></div><div class="actions"><button class="btn" id="newBtn">＋ New</button><button class="btn" id="saveBtn">Save</button><button class="btn" id="loadBtn">Projects</button></div></header><main class="layout"><section class="stageCard"><div class="stage" id="stage"><video id="video" playsinline></video><canvas id="canvas"></canvas><div class="overlayText" id="overlayText"></div><div class="fsbar"><button class="btn" id="videoOnlyBtn">Video</button><button class="btn" id="vizOnlyBtn">Viz</button><button class="btn" id="comboBtn">Combo</button><button class="btn" id="fsBtn">⛶</button></div></div><div class="transport"><div class="row"><button class="btn primary" id="play">▶ Play</button><button class="btn" id="mute">🔊 Audio</button><button class="btn" id="record">● Record</button><button class="btn" id="download" disabled>⇩ Download</button><span class="title" id="now">No media loaded</span><span class="muted" id="time">0:00 / 0:00</span></div><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="row"><label>Master <input id="master" type="range" min="0" max="1" step=".01" value=".9"></label><label>Video volume <input id="videoVol" type="range" min="0" max="1" step=".01" value="1"></label><label>Track volume <input id="trackVol" type="range" min="0" max="1" step=".01" value="1"></label></div></div></section><aside class="panel"><nav class="tabs"><button class="on" data-tab="media">Media</button><button data-tab="visual">Visuals</button><button data-tab="templates">Templates</button><button data-tab="project">Project</button></nav><div id="content"></div></aside></main><div class="footer">Local browser projects · Uploads stay in this session unless you explicitly save project metadata. Recorded video is generated with the browser MediaRecorder.</div></div><input id="files" type (()=>{const $=id=>document.getElementById(id),stage=$("stage"),canvas=$("canvas"),ctx2=canvas.getContext("2d"),video=$("video"),content=$("content"),files=$("files"),track=$("track");let audioCtx,masterGain,analyser,source,trackAudio,trackSource,recordDest,rec,chunks=[],recordUrl="",active=null,media=[],layers=[],tab="media",mode="viz",template="pulse",color="#d946ef",color2="#22d3ee",hue=0,rotation=0,particles=[],last=0,projectName="Untitled",lyrics="",prompt="",showLyrics=true,videoMute=false,videoLayer=true,videoOverlay=false;
const colors=["#d946ef","#22d3ee","#f43f5e","#f59e0b","#84cc16","#3b82f6","#8b5cf6","#ec4899","#14b8a6","#f8fafc","#ef4444","#6366f1"];
const templates=[['pulse','Pulse','Big beat-reactive rings'],['bars','Bars','Vertical spectrum bars'],['tunnel','Tunnel','Forward-moving tunnel'],['glow','Glow','Soft bloom and bass pulses'],['lyrics','Lyrics','Lyric-led typography'],['duo','Duo','Video + visual overlay'],['split','Split','Video and visual side-by-side'],['flash','Flash','Beat flashes and cuts']];
function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);ctx2.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function fmt(t){if(!isFinite(t))return'0:00';return`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`}
async function audioInit(){if(audioCtx){if(audioCtx.state==='suspended')await audioCtx.resume();return}audioCtx=new AudioContext();masterGain=audioCtx.createGain();masterGain.gain.value=+.9;analyser=audioCtx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.72;recordDest=audioCtx.createMediaStreamDestination();masterGain.connect(analyser);analyser.connect(audioCtx.destination);masterGain.connect(recordDest)}
function connectAudio(){if(!active||!active.url||!active.type.startsWith('audio/'))return;audioInit().then(()=>{if(source)try{source.disconnect()}catch{};const a=new Audio(active.url);a.crossOrigin='anonymous';a.loop=false;a.volume=1;trackAudio=a;source=audioCtx.createMediaElementSource(a);source.connect(masterGain);a.onloadedmetadata=()=>update();a.ontimeupdate=update;active.element=a})}
function addFile(f){const url=URL.createObjectURL(f),type=f.type||'';const item={id:crypto.randomUUID(),name:f.name,type,size:f.size,url};media.push(item);if(type.startsWith('video/')){active=item;video.src=url;video.load();video.onloadedmetadata=update;video.ontimeupdate=update;video.onended=()=>{$('play').textContent='▶ Play'}}else if(type.startsWith('audio/')){active=item;connectAudio()}render()}

$('mute').onclick=()=>{videoMute=!videoMute;video.muted=videoMute;if(trackAudio)trackAudio.muted=videoMute;$('mute').textContent=videoMute?'🔇 Muted':'🔊 Audio'};
function setMode(m){mode=m;stage.classList.remove('video-on','video-under','video-overlay');if(m==='video')stage.classList.add('video-on');if(m==='combo')stage.classList.add('video-overlay');if(m==='split')stage.classList.add('video-on');render()}
$('videoOnlyBtn').onclick=()=>setMode('video');$('vizOnlyBtn').onclick=()=>setMode('viz');$('comboBtn').onclick=()=>setMode('combo');$('fsBtn').onclick=()=>{if(!document.fullscreenElement)stage.requestFullscreen?.();else document.exitFullscreen?.()};
function palette(){return `<div class="section"><h3>Color / Hue</h3><div class="swatches">${colors.map(c=>`<button class="sw ${c===color?'on':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><div class="control"><span>Hue shift</span><output>${hue}°</output><input id="hue" type="range" min="-180" max="180" value="${hue}"></div><div class="control"><span>Hue speed</span><output>${rotation.toFixed(1)}</output><input id="hueSpeed" type="range" min="0" max="3" step=".1" value="${rotation}"></div></div>`}
function mediaPanel(){return `<div class="section"><div class="row"><button class="btn primary" id="add">＋ Media</button><button class="btn" id="addTrack">＋ Soundtrack</button></div><p class="muted small">Upload audio, video, images, or multiple files. Each uploaded item can be used as the source, background, or overlay.</p><div class="list">${media.map(x=>`<div class="item ${active?.id===x.id?'active':''}" data-media="${x.id}"><span>${x.type.startsWith('video/')?'🎬':x.type.startsWith('audio/')?'🎵':'🖼️'}</span><div class="grow"><div class="ellipsis">${x.name}</div><div class="small muted">${x.type||'media'}</div></div><button class="btn" data-del="${x.id}">×</button></div>`).join('')||'<div class="muted small">Nothing uploaded yet.</div>'}</div></div><div class="section"><h3>Video layer</h3><div class="checks"><label><input id="showVideo" type="checkbox" ${videoLayer?'checked':''}> Show video</label><label><input id="overlayVideo" type="checkbox" ${videoOverlay?'checked':''}> Overlay visualizer</label><label><input id="coverVideo" type="checkbox"> Fill screen</label></div></div>`}

function templatePanel(){return `<div class="section"><h3>TikTok-style templates</h3><p class="muted small">Quick edit recipes for uploaded media. Choose one, then adjust it in Visuals.</p>${templates.map(t=>`<button class="mod" data-template="${t[0]}"><b>${t[1]}</b><div class="small muted">${t[2]}</div></button>`).join('')}</div><div class="section"><h3>Layer modes</h3><div class="row"><button class="btn" data-view="viz">Visualizer only</button><button class="btn" data-view="video">Video only</button><button class="btn" data-view="combo">Overlay</button><button class="btn" data-view="split">Split</button></div></div>`}

function bindPanel(){
$('add')?.addEventListener('click',()=>files.click());$('addTrack')?.addEventListener('click',()=>track.click());document.querySelectorAll('[data-media]').forEach(b=>b.onclick=()=>{active=media.find(x=>x.id===b.dataset.media);if(active.type.startsWith('video/')){video.src=active.url;video.load()}else if(active.type.startsWith('audio/'))connectAudio();$('now').textContent=active.name;render()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();media=media.filter(x=>x.id!==b.dataset.del);if(active?.id===b.dataset.del)active=null;render()});$('showVideo')?.addEventListener('change',e=>{videoLayer=e.target.checked;stage.classList.toggle('video-on',videoLayer&&mode!=='viz')});$('overlayVideo')?.addEventListener('change',e=>{videoOverlay=e.target.checked;stage.classList.toggle('video-overlay',e.target.checked)});$('coverVideo')?.addEventListener('change',e=>video.classList.toggle('cover',e.target.checked));$('template')?.addEventListener('change',e=>{template=e.target.value;log('Template: '+template)});$('intensity')?.addEventListener('input',e=>window.intensity=+e.target.value);$('motion')?.addEventListener('input',e=>window.motion=+e.target.value);$('glow')?.addEventListener('input',e=>window.glow=+e.target.value);$('lyrics')?.addEventListener('input',e=>lyrics=e.target.value);$('showLyrics')?.addEventListener('change',e=>showLyrics=e.target.checked);$('prompt')?.addEventListener('input',e=>prompt=e.target.value);$('applyPrompt')?.addEventListener('click',()=>{const p=prompt.toLowerCase();if(p.includes('blue')||p.includes('cyan'))color='#22d3ee';if(p.includes('pink')||p.includes('magenta'))color='#d946ef';if(p.includes('red'))color='#f43f5e';if(p.includes('orange'))color='#f59e0b';if(p.includes('green'))color='#84cc16';if(p.includes('purple'))color='#8b5cf6';if(p.includes('slow'))window.motion=.35;if(p.includes('fast'))window.motion=1.4;if(p.includes('glow'))window.glow=1.4;log('Applied visual prompt');render()});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;render()});$('hue')?.addEventListener('input',e=>hue=+e.target.value);$('hueSpeed')?.addEventListener('input',e=>rotation=+e.target.value);document.querySelectorAll('[data-template]').forEach(b=>b.onclick=()=>{template=b.dataset.template;log('Template: '+template);tab='visual';render()});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setMode(b.dataset.view));$('projectName')?.addEventListener('input',e=>projectName=e.target.value);$('saveProject')?.addEventListener('click',saveProject);$('exportProject')?.addEventListener('click',exportProject);$('importProject')?.addEventListener('click',importProject)}
function log(s){const a=JSON.parse(localStorage.getItem('cadenceActivity')||'[]');a.unshift({t:Date.now(),s});localStorage.setItem('cadenceActivity',JSON.stringify(a.slice(0,100)))}
function saveProject(){projectName=$('projectName')?.value||projectName;const p={name:projectName,template,color,color2,hue,rotation,intensity:window.intensity||.8,motion:window.motion||.7,glow:window.glow||.7,lyrics,prompt,showLyrics,mode,videoLayer,videoOverlay,savedAt:Date.now()};localStorage.setItem('cadenceProject:'+projectName,JSON.stringify(p));log('Saved project: '+projectName);alert('Project settings saved locally. Media files themselves remain in the current browser session unless exported by the browser.')}function exportProject(){const p={name:projectName,template,color,hue,rotation,intensity:window.intensity||.8,motion:window.motion||.7,glow:window.glow||.7,lyrics,prompt,showLyrics,mode,videoLayer,videoOverlay};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download=(projectName||'cadence-project')+'.json';a.click()}function importProject(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files[0];if(!f)return;const p=JSON.parse(await f.text());Object.assign(window,{intensity:p.intensity||.8,motion:p.motion||.7,glow:p.glow||.7});projectName=p.name||'Imported';template=p.template||template;color=p.color||color;hue=p.hue||0;rotation=p.rotation||0;lyrics=p.lyrics||'';prompt=p.prompt||'';showLyrics=p.showLyrics!==false;mode=p.mode||'viz';videoLayer=p.videoLayer!==false;videoOverlay=!!p.videoOverlay;render();log('Imported project settings')}};i.click()}
$('saveBtn').onclick=saveProject;$('newBtn').onclick=()=>{media=[];active=null;lyrics='';prompt='';projectName='Untitled';video.src='';render();log('New project')};$('loadBtn').onclick=()=>{tab='project';render()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});
function draw(t=0){resize();const w=stage.clientWidth,h=stage.clientHeight;ctx2.clearRect(0,0,w,h);let bins=analyser?analyser.frequencyBinCount:0;let data=analyser?new Uint8Array(bins):null;if(data)analyser.getByteFrequencyData(data);let energy=0;if(data){for(let i=0;i<data.length;i++)energy+=data[i];energy/=Math.max(1,data.length*255)}else energy=.25+.15*Math.sin(t/500);const beat=Math.min(1,energy*2.2)*(window.intensity||.8);const c1=color,c2=color2;ctx2.save();ctx2.globalCompositeOperation='lighter';if(template==='bars'){const n=64,bw=w/n;for(let i=0;i<n;i++){const v=data?data[Math.floor(i/n*data.length)]/255:energy;const bh=v*h*.65*(window.intensity||.8);ctx2.fillStyle=i%2?c2:c1;ctx2.globalAlpha=.25+v;ctx2.fillRect(i*bw,h-bh,bw-2,bh)}}else if(template==='tunnel'){ctx2.translate(w/2,h/2);for(let i=0;i<24;i++){const z=((i*55+t*(window.motion||.7)*.08)%900);const s=Math.max(.02,1-z/1000);const rw=w*s*.8,rh=h*s*.8;ctx2.strokeStyle=i%2?c1:c2;ctx2.globalAlpha=.08+.03*i;ctx2.lineWidth=2+beat*4;ctx2.strokeRect(-rw/2,-rh/2,rw,rh)}}else if(template==='glow'||template==='pulse'||template==='duo'||template==='split'){ctx2.translate(w/2,h/2);const r=Math.min(w,h)*(.12+beat*.35);for(let i=0;i<9;i++){ctx2.beginPath();ctx2.arc(0,0,r+i*28+Math.sin(t/700+i)*10,0,Math.PI*2);ctx2.strokeStyle=i%2?c1:c2;ctx2.globalAlpha=.06+.04*beat;ctx2.lineWidth=4+beat*10;ctx2.stroke()}}else if(template==='flash'){ctx2.fillStyle=energy>.42?c1:'transparent';ctx2.globalAlpha=Math.max(0,(energy-.35)*1.6);ctx2.fillRect(0,0,w,h)}else if(template==='lyrics'){ctx2.translate(w/2,h/2);for(let i=0;i<10;i++){ctx2.beginPath();ctx2.arc(Math.cos(t/900+i)*r(i),Math.sin(t/900+i)*r(i),5+beat*20,0,Math.PI*2);ctx2.fillStyle=i%2?c1:c2;ctx2.globalAlpha=.15;ctx2.fill()}}else{ctx2.translate(w/2,h/2);for(let i=0;i<48;i++){const a=i*Math.PI*2/48+t/250*(rotation||.7);const v=data?data[i%data.length]/255:energy;const r0=70+v*160;ctx2.beginPath();ctx2.moveTo(Math.cos(a)*r0,Math.sin(a)*r0);ctx2.lineTo(Math.cos(a)*(r0+20+v*90),Math.sin(a)*(r0+20+v*90));ctx2.strokeStyle=i%2?c1:c2;ctx2.globalAlpha=.2+v*.7;ctx2.lineWidth=1+v*4;ctx2.stroke()}}ctx2.restore();if(showLyrics&&lyrics){const lines=lyrics.split(/\n+/).filter(Boolean);const el=$('overlayText');const dur=(active?.element?.duration||video.duration||trackAudio?.duration||60);const idx=Math.min(lines.length-1,Math.floor(((active?.element?.currentTime||video.currentTime||trackAudio?.currentTime||0)/dur)*lines.length));el.textContent=lines[idx]||''}else $('overlayText').textContent='';requestAnimationFrame(draw)}function r(i){return 60+i*18+Math.sin(i)*12}draw();render();
function startRecord(){if(!canvas.captureStream){alert('Canvas recording is not supported in this browser.');return}if(!audioCtx)audioInit();const vs=canvas.captureStream(30),tracks=[...vs.getVideoTracks()];if(recordDest)tracks.push(...recordDest.stream.getAudioTracks());const stream=new MediaStream(tracks);const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];const mime=types.find(x=>MediaRecorder.isTypeSupported(x))||'';chunks=[];rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{recordUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'video/webm'}));$('download').disabled=false;log('Recorded visualization')};rec.start(500);$('record').textContent='■ Stop';$('record').onclick=stopRecord;log('Started recording')}
function stopRecord(){if(rec&&rec.state!=='inactive')rec.stop();$('record').textContent='● Record';$('record').onclick=startRecord}$('record').onclick=startRecord;$('download').onclick=()=>{if(!recordUrl)return;const a=document.createElement('a');a.href=recordUrl;a.download=(projectName||'cadence-video')+'.webm';a.click();log('Downloaded recording')};
})();</script></body></html>

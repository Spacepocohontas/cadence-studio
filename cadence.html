<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><title>Cadence — Local DJ + Visual Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#08080c;color:#eee;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:1500px;margin:auto;padding:10px}.top,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-weight:900;letter-spacing:.08em}.muted,.small{color:#9999a5}.small{font-size:11px}.btn{border:1px solid #30303a;background:#18181f;color:#eee;border-radius:10px;padding:9px 12px;cursor:pointer}.primary{background:#eee;color:#08080c}.accent{background:#d946ef;border-color:#d946ef}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:10px}.stage{height:min(67vh,720px);min-height:350px;background:#000;border-radius:16px;overflow:hidden;position:relative}.stage>*{position:absolute}.stage video{inset:0;width:100%;height:100%;object-fit:contain;display:none;z-index:2}.stage.video video{display:block}.stage.combo video{display:block;opacity:.42;mix-blend-mode:screen}.stage canvas{inset:0;width:100%;height:100%;z-index:3}.hud{left:5%;right:5%;bottom:8%;z-index:5;text-align:center;font-size:clamp(18px,3vw,42px);font-weight:900;text-shadow:0 3px 20px #000}.stagebar{right:10px;top:10px;z-index:8}.card,.panel{background:#111116;border:1px solid #292930;border-radius:15px;padding:10px}.card{margin-top:10px}.panel{max-height:calc(67vh + 20px);overflow:auto}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;background:#111116;padding-bottom:8px;z-index:9}.tabs button{border:0;border-radius:8px;padding:8px 3px;background:#19191f;color:#aaa}.tabs .on{background:#eee;color:#08080c}.timeline{display:flex;gap:6px;overflow:auto;padding:8px;background:#0b0b0f;border-radius:10px;min-height:74px}.clip{min-width:130px;background:#202027;border:1px solid #34343e;border-radius:8px;padding:7px;cursor:pointer}.clip.sel{border-color:#d946ef}.list{display:grid;gap:5px}.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:7px;align-items:center;background:#15151b;border-radius:9px;padding:8px}.grow{min-width:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}input,select,textarea{width:100%;background:#0d0d12;color:#eee;border:1px solid #30303a;border-radius:8px;padding:8px;margin-top:4px}textarea{min-height:75px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.sw{height:27px;border-radius:7px;border:2px solid transparent}.sw.on{border-color:#fff}.hide{display:none}.pill{padding:4px 7px;border-radius:99px;background:#262630;font-size:11px}.playlist{display:grid;gap:6px}.pl{padding:9px;background:#17171d;border-radius:9px;cursor:pointer}.pl.on{outline:1px solid #d946ef}.danger{background:#261317}.progress{height:4px;background:#2a2a32;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:#d946ef;width:0}.check{display:flex;gap:7px;align-items:center;color:#aaa}.check input{width:auto}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{max-height:none}.stage{height:55vh}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">CADENCE</div><div class="small">LOCAL DJ · VISUALIZER · MUSIC VIDEO STUDIO</div></div><div class="row"><button class="btn" id="new">＋ New</button><button class="btn" id="save">Save</button><button class="btn" id="full">⛶ Fullscreen</button></div></header><main class="grid"><section><div class="stage" id="stage"><video id="video" playsinline></video><canvas id="canvas"></canvas><div class="hud" id="hud"></div><div class="stagebar row"><button class="btn" id="viz">Viz</button><button class="btn" id="vid">Video</button><button class="btn" id="combo">Combo</button></div></div><div class="card"><div class="row"><button class="btn primary" id="play">▶</button><button class="btn" id="prev">⏮</button><button class="btn" id="next">⏭</button><button class="btn" id="shuffle">🔀</button><button class="btn" id="repeat">🔁 Off</button><button class="btn" id="mute">🔊</button><button class="btn" id="record">● Record</button><button class="btn" id="download" disabled>⇩</button><span class="muted" id="clock">0:00 / 0:00</span></div><input id="seek" type="range" min="0" max="100" value="0"><div class="row"><label>Master<input id="master" type="range" min="0" max="1" step=".01" value=".9"></label><label>Video<input id="vvol" type="range" min="0" max="1" step=".01" value="1"></label></div></div><div class="card"><b>Timeline</b><div class="timeline" id="timeline"></div></div></section><aside class="panel"><nav class="tabs"><button class="on" data-tab="library">Library</button><button data-tab="playlists">Playlists</button><button data-tab="visuals">Visuals</button><button data-tab="ai">AI Video</button><button data-tab="project">Project</button></nav><div id="panel"></div></aside></main></div><input id="upload" type="file" multiple accept="audio/*,video/*,image/*" class="hide"><input id="import" type="file" accept="application/json" class="hide"><script>
(()=>{
const $=id=>document.getElementById(id),stage=$('stage'),canvas=$('canvas'),ctx=canvas.getContext('2d'),video=$('video'),dbName='cadence-local-v1';let db,media=[],currentId=null,playlistId=null,mode='viz',shuffle=false,repeat=0,muted=false,tab='library',audio,source,gain,analyser,recordDest,rec,chunks=[],recordUrl='',autoRotate=false;let cfg={module:'pulse',color:'#d946ef',color2:'#22d3ee',intensity:.9,motion:.8,glow:.8,lyrics:'',prompt:''};const colors=['#d946ef','#22d3ee','#f43f5e','#f59e0b','#84cc16','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f8fafc','#ef4444','#6366f1'];const modules=[['pulse','Pulse'],['bars','Spectrum Bars'],['orbit','Orbit'],['tunnel','Tunnel'],['wave','Waveform'],['glow','Bass Glow'],['nebula','Nebula'],['lyrics','Lyric Flow']];
function openDB(){return new Promise((ok,no)=>{const r=indexedDB.open(dbName,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('media'))d.createObjectStore('media',{keyPath:'id'});if(!d.objectStoreNames.contains('playlists'))d.createObjectStore('playlists',{keyPath:'id'});if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'})};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}function tx(store,mode='readonly'){return db.transaction(store,mode).objectStore(store)}async function put(store,x){return new Promise((ok,no)=>{const r=tx(store,'readwrite').put(x);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}async function all(store){return new Promise((ok,no)=>{const r=tx(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function del(store,id){return new Promise((ok,no)=>{const r=tx(store,'readwrite').delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
function fmt(t){return isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00'}function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
async function loadLibrary(){media=await all('media');render()}async function addFiles(files){for(const f of files){const x={id:crypto.randomUUID(),name:f.name,type:f.type,size:f.size,blob:f,created:Date.now(),favorite:false,locked:false};await put('media',x);media.push(x)}if(files.length){currentId=media[media.length-files.length].id;loadCurrent()}render()}
function current(){return media.find(x=>x.id===currentId)}async function loadCurrent(){const x=current();if(!x)return;const url=URL.createObjectURL(x.blob);if(x.type.startsWith('video/')){video.src=url;video.muted=muted;video.volume=+$('vvol').value;video.load()}else if(x.type.startsWith('audio/')){if(audio)audio.pause();audio=new Audio(url);audio.crossOrigin='anonymous';await initAudio();source=audioCtx.createMediaElementSource(audio);source.connect(gain);audio.ontimeupdate=update;audio.onended=ended}else{video.src=url;video.load()}renderTimeline()}
let audioCtx;async function initAudio(){audioCtx=audioCtx||new AudioContext();if(audioCtx.state==='suspended')await audioCtx.resume();if(!gain){gain=audioCtx.createGain();analyser=audioCtx.createAnalyser();analyser.fftSize=1024;recordDest=audioCtx.createMediaStreamDestination();gain.connect(analyser);analyser.connect(audioCtx.destination);gain.connect(recordDest)}}function el(){return current()?.type.startsWith('audio/')?audio:video}function update(){const e=el(),d=e?.duration||0,t=e?.currentTime||0;$('seek').value=d?t/d*100:0;$('clock').textContent=fmt(t)+' / '+fmt(d)}function ended(){if(repeat===1){el().currentTime=0;el().play()}else if(repeat===2)next()}$('play').onclick=async()=>{const e=el();if(!e)return;await initAudio();if(e.paused){e.play();$('play').textContent='Ⅱ'}else{e.pause();$('play').textContent='▶'}};$('seek').oninput=e=>{const q=el();if(q?.duration)q.currentTime=+e.target.value/100*q.duration};$('master').oninput=e=>{if(gain)gain.gain.value=+e.target.value};$('vvol').oninput=e=>video.volume=+e.target.value;$('mute').onclick=()=>{muted=!muted;video.muted=muted;if(audio)audio.muted=muted;$('mute').textContent=muted?'🔇':'🔊'};
function next(dir=1){if(!media.length)return;let idx=media.findIndex(x=>x.id===currentId),n;if(shuffle)n=Math.floor(Math.random()*media.length);else n=(idx+dir+media.length)%media.length;currentId=media[n].id;loadCurrent();el()?.play().catch(()=>{});render()}$('next').onclick=()=>next(1);$('prev').onclick=()=>next(-1);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').classList.toggle('primary',shuffle)};$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').textContent=['🔁 Off','🔁 Track','🔁 All'][repeat]};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.();$('viz').onclick=()=>{mode='viz';stage.className='stage'};$('vid').onclick=()=>{mode='video';stage.className='stage video'};$('combo').onclick=()=>{mode='combo';stage.className='stage combo'};
async function deleteMedia(id){const x=media.find(m=>m.id===id);if(x?.locked){alert('Locked media cannot be deleted.');return}await del('media',id);media=media.filter(m=>m.id!==id);if(currentId===id){currentId=media[0]?.id;loadCurrent()}render()}async function toggle(id,k){const x=media.find(m=>m.id===id);x[k]=!x[k];await put('media',x);render()}
function library(){return `<div class="card"><div class="row"><button class="btn primary" id="add">＋ Upload & save locally</button><span class="pill">${media.length} files</span></div><p class="small">Files are stored in this browser with IndexedDB. Closing/reopening Cadence does not require re-uploading them. Clearing browser site data will remove them.</p></div><div class="list">${media.map(x=>`<div class="item"><span>${x.type.startsWith('video/')?'🎬':x.type.startsWith('audio/')?'🎵':'🖼️'}</span><div class="grow"><div class="ell">${x.name}</div><span class="small">${fmt(x.duration||0)} · ${Math.round(x.size/1024)} KB</span></div><button class="btn" data-fav="${x.id}">${x.favorite?'★':'☆'}</button><button class="btn" data-lock="${x.id}">${x.locked?'🔒':'🔓'}</button><button class="btn danger" data-del="${x.id}">×</button></div>`).join('')||'<div class="muted">Your local library is empty.</div>'}`}
let playlists=[];async function loadPlaylists(){playlists=await all('playlists')}function playlistsView(){return `<div class="card"><div class="row"><input id="plname" placeholder="Playlist name"><button class="btn accent" id="createpl">＋ Create</button></div></div><div class="playlist">${playlists.map(p=>`<div class="pl ${playlistId===p.id?'on':''}" data-pl="${p.id}"><b>${p.name}</b><div class="small">${p.items.length} items</div><div class="row"><button class="btn" data-playpl="${p.id}">▶</button><button class="btn" data-delpl="${p.id}">×</button></div></div>`).join('')||'<div class="muted">No playlists yet.</div>'}</div>${playlistId?`<div class="card"><b>Selected playlist</b><div class="small">Click a library item to add it, or use the Add buttons below.</div>${(playlists.find(p=>p.id===playlistId)?.items||[]).map(id=>{const x=media.find(m=>m.id===id);return x?`<div class="item"><span>🎵</span><div class="grow ell">${x.name}</div><button class="btn" data-rm="${id}">×</button></div>`:''}).join('')}</div>`:''}`}
function visuals(){return `<div class="card"><b>Visualizer module</b><select id="module">${modules.map(m=>`<option value="${m[0]}" ${cfg.module===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><div class="small">⭐ Favorites and 🔒 locks are retained when the library rotates.</div></div><div class="card"><b>Colors</b><div class="swatches">${colors.map(c=>`<button class="sw ${cfg.color===c?'on':''}" style="background:${c}" data-color="${c}"></button>`).join('')}</div><label>Hue<input id="hue" type="range" min="-180" max="180" value="${cfg.hue||0}"></label><label>Intensity<input id="intensity" type="range" min="0" max="2" step=".01" value="${cfg.intensity}"></label><label>Motion<input id="motion" type="range" min="0" max="2" step=".01" value="${cfg.motion}"></label><label>Glow<input id="glow" type="range" min="0" max="2" step=".01" value="${cfg.glow}"></label></div><div class="card"><b>Lyrics</b><textarea id="lyrics">${cfg.lyrics}</textarea></div><div class="card"><b>Automatic surprise mode</b><button class="btn accent" id="surprise">✨ Surprise module</button> <button class="btn" id="autor">${autoRotate?'■ Stop':'▶ Auto-rotate'}</button><p class="small">Rotation never deletes locked/favorite media or modules.</p></div>`}
function ai(){return `<div class="card"><b>AI Video Generator</b><p class="small">Use the server-side video endpoint already added to this project. Your API key stays off the client.</p><textarea id="aip" placeholder="Describe the music-video scene, camera, mood, transitions and visual story…">${cfg.prompt}</textarea><select id="aim"><option>sora-2</option><option>sora-2-pro</option></select><select id="ais"><option>4</option><option selected>8</option><option>12</option></select><select id="size"><option>1280x720</option><option>720x1280</option><option>1792x1024</option><option>1024x1792</option></select><button class="btn accent" id="gen">Generate video</button><div id="aistat" class="small">Ready.</div></div><div class="card"><b>Generated clips</b><div id="generated" class="small">Generated clips can be saved into the local library after download/import.</div></div>`}
function project(){return `<div class="card"><input id="pname" placeholder="Project name"><button class="btn primary" id="savep">Save project locally</button><button class="btn" id="export">Export project settings</button><button class="btn" id="importp">Import settings</button></div><div class="card"><b>Storage model</b><p class="small">Media blobs live in IndexedDB; playlists and project metadata are separate records. You can delete individual files without deleting the whole project.</p></div>`}
async function render(){if(tab==='playlists')await loadPlaylists();$('panel').innerHTML=tab==='library'?library():tab==='playlists'?playlistsView():tab==='visuals'?visuals():tab==='ai'?ai():project();bindPanel();renderTimeline()}
function bindPanel(){$('add')?.onclick=()=>$('upload').click();document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteMedia(b.dataset.del));document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggle(b.dataset.fav,'favorite'));document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>toggle(b.dataset.lock,'locked'));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});document.querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>{playlistId=b.dataset.pl;render()});$('createpl')?.onclick=async()=>{const name=$('plname').value.trim()||'New Playlist';const p={id:crypto.randomUUID(),name,items:[],created:Date.now()};await put('playlists',p);playlistId=p.id;render()};document.querySelectorAll('[data-delpl]').forEach(b=>b.onclick=async()=>{await del('playlists',b.dataset.delpl);if(playlistId===b.dataset.delpl)playlistId=null;render()});document.querySelectorAll('[data-playpl]').forEach(b=>b.onclick=()=>playPlaylist(b.dataset.playpl));document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const p=playlists.find(x=>x.id===playlistId);p.items=p.items.filter(id=>id!==b.dataset.rm);await put('playlists',p);render()});$('module')?.addEventListener('change',e=>cfg.module=e.target.value);document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{cfg.color=b.dataset.color;render()});$('hue')?.addEventListener('input',e=>cfg.hue=+e.target.value);$('intensity')?.addEventListener('input',e=>cfg.intensity=+e.target.value);$('motion')?.addEventListener('input',e=>cfg.motion=+e.target.value);$('glow')?.addEventListener('input',e=>cfg.glow=+e.target.value);$('lyrics')?.addEventListener('input',e=>cfg.lyrics=e.target.value);$('surprise')?.onclick=()=>{cfg.module=modules[Math.floor(Math.random()*modules.length)][0];render()};$('autor')?.onclick=()=>{autoRotate=!autoRotate;render()};$('gen')?.onclick=generateVideo;$('savep')?.onclick=saveProject;$('export')?.onclick=exportProject;$('importp')?.onclick=()=>$('import').click()}
async function playPlaylist(id){const p=playlists.find(x=>x.id===id)||await (async()=>{playlists=await all('playlists');return playlists.find(x=>x.id===id)})();if(!p||!p.items.length)return;currentId=p.items[0];loadCurrent();el()?.play().catch(()=>{});playlistId=id;tab='playlists';render()}
$('upload').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};$('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;const p=JSON.parse(await f.text());cfg=p.cfg||cfg;render()};
async function saveProject(){const p={id:'main',cfg,currentId,playlistId,mode,shuffle,repeat,saved:Date.now()};await put('projects',p);alert('Cadence project saved locally.')}async function exportProject(){const p={cfg,currentId,playlistId,mode,shuffle,repeat};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download='cadence-project.json';a.click()}$('save').onclick=saveProject;$('new').onclick=()=>{currentId=null;playlistId=null;video.removeAttribute('src');if(audio)audio.pause();render()};
function renderTimeline(){$('timeline').innerHTML=media.map(x=>`<div class="clip ${x.id===currentId?'sel':''}" data-clip="${x.id}">${x.type.startsWith('video/')?'🎬':x.type.startsWith('audio/')?'🎵':'🖼️'} ${x.name.slice(0,16)}<br><span class="small">${x.favorite?'★ ':''}${x.locked?'🔒 ':''}</span></div>`).join('')||'<span class="muted">Upload media to build your timeline.</span>';document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>{currentId=b.dataset.clip;loadCurrent()})}
$('record').onclick=()=>{if(rec){rec.stop();rec=null;$('record').textContent='● Record';return}if(!canvas.captureStream)return alert('Recording is not supported here.');initAudio().then(()=>{const s=canvas.captureStream(30);recordDest?.stream.getAudioTracks().forEach(t=>s.addTrack(t));chunks=[];rec=new MediaRecorder(s);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{recordUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'video/webm'}));$('download').disabled=false};rec.start();$('record').textContent='■ Stop'})};$('download').onclick=()=>{const a=document.createElement('a');a.href=recordUrl;a.download='cadence-visual.webm';a.click()};
async function generateVideo(){const prompt=$('aip').value.trim();if(!prompt)return;$('aistat').textContent='Submitting…';try{let r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',prompt,model:$('aim').value,seconds:$('ais').value,size:$('size').value})});let j=await r.json();if(!r.ok)throw Error(j.error||'Generation failed');$('aistat').textContent='Queued: '+j.id;let s=j;while(s.status==='queued'||s.status==='in_progress'){await new Promise(x=>setTimeout(x,3000));r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',id:j.id})});s=await r.json();$('aistat').textContent=s.status+' '+(s.progress||0)+'%'}if(s.status==='completed'){$('aistat').innerHTML=`Completed. <button class="btn" onclick="location.href='/api/video?id=${encodeURIComponent(j.id)}'">Download</button>`}else $('aistat').textContent=s.error?.message||'Generation failed.'}catch(e){$('aistat').textContent=e.message}}
function draw(t=0){resize();const w=stage.clientWidth,h=stage.clientHeight;ctx.clearRect(0,0,w,h);let q=analyser?new Uint8Array(analyser.frequencyBinCount):null,e=.25;if(q){analyser.getByteFrequencyData(q);e=q.reduce((a,b)=>a+b,0)/(q.length*255)}const beat=e*cfg.intensity;ctx.save();ctx.translate(w/2,h/2);for(let i=0;i<56;i++){const a=i*Math.PI*2/56+t/1000*cfg.motion;const v=q?q[i%q.length]/255:e;const r=60+v*190+beat*35;ctx.beginPath();if(cfg.module==='bars')ctx.rect(Math.cos(a)*r,Math.sin(a)*r,3,20+v*100);else if(cfg.module==='wave')ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);else ctx.arc(Math.cos(a)*r,Math.sin(a)*r,5+v*20,0,Math.PI*2);ctx.fillStyle=i%2?cfg.color:cfg.color2;ctx.strokeStyle=cfg.color;ctx.globalAlpha=.18+v*.8;ctx.shadowBlur=cfg.glow*25;ctx.shadowColor=cfg.color;cfg.module==='bars'?ctx.fill():ctx.stroke()}ctx.restore();if(cfg.lyrics){const ls=cfg.lyrics.split(/\n+/).filter(Boolean),e2=el(),i=Math.min(ls.length-1,Math.floor(((e2?.currentTime||0)/Math.max(1,e2?.duration||60))*ls.length));$('hud').textContent=ls[i]||''}else $('hud').textContent='';if(autoRotate&&Math.floor(t/12000)!==Math.floor((t-16)/12000))cfg.module=modules[Math.floor(Math.random()*modules.length)][0];requestAnimationFrame(draw)}draw();openDB().then(loadLibrary).catch(()=>{ $('panel').innerHTML='<div class="card">Browser storage is unavailable. Try Safari/Chrome with site storage enabled.</div>'});
})();</script></body></html>

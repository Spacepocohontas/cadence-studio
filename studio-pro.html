<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07070a"><title>Cadence Pro — DJ + Music Video Studio</title><style>body{margin:0;background:#07070a;color:#eee;font:14px system-ui}.app{max-width:1500px;margin:auto;padding:10px}.bar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bar{justify-content:space-between}.btn{background:#18181f;color:#eee;border:1px solid #30303a;border-radius:10px;padding:9px 12px}.primary{background:#eee;color:#08080b}.pink{background:#d946ef;color:white}.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:10px}.stage{position:relative;height:min(68vh,720px);min-height:360px;background:#000;border-radius:16px;overflow:hidden}.stage>*{position:absolute;inset:0;width:100%;height:100%}.stage video{object-fit:contain;display:none}.stage.vshow video{display:block;z-index:1}.stage.overlay video{display:block;opacity:.45;mix-blend-mode:screen;z-index:2}.stage canvas{z-index:3}.hud{z-index:5!important;inset:auto 5% 7%!important;height:auto!important;text-align:center;font-size:clamp(16px,3vw,34px);font-weight:800;text-shadow:0 3px 20px #000}.fs{z-index:9!important;inset:10px 10px auto auto!important;width:auto!important;height:auto!important}.panel{background:#111116;border:1px solid #2a2a32;border-radius:16px;padding:10px;max-height:calc(68vh - 20px);overflow:auto}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:sticky;top:0;background:#111116;z-index:10;padding-bottom:8px}.tabs button{padding:9px 4px;border:0;border-radius:8px;background:#19191f;color:#aaa}.tabs .on{background:#eee;color:#09090b}.card{background:#19191f;border:1px solid #292932;border-radius:12px;padding:10px;margin-bottom:8px}.small{font-size:11px;color:#9b9ba5}.muted{color:#9b9ba5}.list{display:grid;gap:5px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center;padding:8px;background:#121218;border-radius:9px}.grow{min-width:0}.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}input,select,textarea{width:100%;box-sizing:border-box;background:#0f0f14;color:#eee;border:1px solid #30303a;border-radius:8px;padding:8px}textarea{min-height:80px}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.sw{height:26px;border-radius:7px;border:2px solid transparent}.sw.on{border-color:#fff}.range{width:100%}.timeline{position:relative;background:#0e0e12;border:1px solid #2a2a32;border-radius:12px;padding:8px;min-height:90px;overflow:auto}.clip{display:inline-flex;vertical-align:top;min-width:130px;height:58px;margin-right:6px;padding:6px;border-radius:8px;background:#22222a;border:1px solid #3a3a45;flex-direction:column;justify-content:center}.clip.sel{border-color:#d946ef}.meter{height:5px;background:#292932;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#d946ef}.status{padding:8px;border-radius:8px;background:#101014}.hide{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.panel{max-height:none}.stage{height:55vh}}</style></head><body><div class="app"><header class="bar"><div><b>CADENCE PRO</b><div class="small">DJ · Visualizer · Timeline · AI Video</div></div><div class="row"><button class="btn" id="new">＋ New</button><button class="btn" id="save">Save</button><button class="btn" id="full">⛶ Fullscreen</button></div></header><main class="grid"><section><div class="stage" id="stage"><video id="vid" playsinline></video><canvas id="cv"></canvas><div class="hud" id="hud"></div><div class="fs"><button class="btn" id="viz">Viz</button><button class="btn" id="vidOnly">Video</button><button class="btn" id="combo">Combo</button></div></div><div class="card"><div class="row"><button class="btn primary" id="play">▶</button><button class="btn" id="prev">⏮</button><button class="btn" id="next">⏭</button><button class="btn" id="shuffle">🔀 Shuffle</button><button class="btn" id="repeat">🔁 Repeat: Off</button><button class="btn" id="mute">🔊</button><button class="btn" id="rec">● Record</button><button class="btn" id="dl" disabled>⇩</button><span class="muted" id="clock">0:00 / 0:00</span></div><input class="range" id="seek" type="range" min="0" max="100" value="0"><div class="row"><label>Master <input id="master" type="range" min="0" max="1" step=".01" value=".9"></label><label>Video <input id="vvol" type="range" min="0" max="1" step=".01" value="1"></label></div></div><div class="card"><b>Timeline</b><div id="timeline" class="timeline"></div><div class="row"><button class="btn" id="trim">✂ Trim selected</button><button class="btn" id="transition">＋ Transition</button><button class="btn" id="snap">📸 Snapshot</button></div></div></section><aside class="panel"><nav class="tabs"><button class="on" data-t="media">Media</button><button data-t="viztab">Visuals</button><button data-t="library">Library</button><button data-t="ai">AI Video</button><button data-t="project">Project</button></nav><div id="panel"></div></aside></main></div><input id="files" type="file" multiple accept="audio/*,video/*,image/*" class="hide"><input id="sound" type="file" accept="audio/*" class="hide"><script>
(()=>{const $=x=>document.getElementById(x),cv=$('cv'),cx=cv.getContext('2d'),stage=$('stage'),vid=$('vid');let items=[],sel=-1,tab='media',mode='viz',template='pulse',repeat=0,shuffle=false,muted=false,rec,chunks=[],recordUrl='',audioCtx,gain,analyser,source,trackAudio,recordDest;let cfg={color:'#d946ef',color2:'#22d3ee',hue:0,intensity:.9,motion:.8,glow:.8,lyrics:'',prompt:''};const sw=['#d946ef','#22d3ee','#f43f5e','#f59e0b','#84cc16','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f8fafc','#ef4444','#6366f1'];const mods=[['pulse','Pulse'],['bars','Spectrum Bars'],['orbit','Orbit'],['tunnel','Tunnel'],['nebula','Nebula'],['lyrics','Lyric Flow'],['wave','Waveform'],['glow','Bass Glow']];const clips=()=>items.map((x,i)=>`<div class="clip ${i===sel?'sel':''}" data-sel="${i}">${x.type.startsWith('video/')?'🎬':x.type.startsWith('audio/')?'🎵':'🖼️'} ${x.name.slice(0,18)}<span class="small">${x.duration?fmt(x.duration):'media'}</span></div>`).join('');function fmt(t){return isFinite(t)?`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`:'0:00'}function resize(){const r=stage.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;cx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function log(s){const a=JSON.parse(localStorage.cadenceActivity||'[]');a.unshift({s,t:Date.now()});localStorage.cadenceActivity=JSON.stringify(a.slice(0,200))}function add(f){const x={id:crypto.randomUUID(),name:f.name,type:f.type,url:URL.createObjectURL(f),size:f.size,duration:0,locked:false,favorite:false};items.push(x);if(f.type.startsWith('video/')){const v=document.createElement('video');v.src=x.url;v.onloadedmetadata=()=>{x.duration=v.duration;renderTimeline()}}if(f.type.startsWith('audio/')){const a=new Audio(x.url);a.onloadedmetadata=()=>{x.duration=a.duration;renderTimeline()}}sel=items.length-1;loadSel();log('Added '+f.name)}$('files').onchange=e=>{[...e.target.files].forEach(add);e.target.value=''};function loadSel(){if(sel<0)return;const x=items[sel];if(x.type.startsWith('video/')){vid.src=x.url;vid.load();vid.muted=muted;vid.volume=+$('vvol').value}else if(x.type.startsWith('audio/')){setupAudio(x.url)}$('clock').textContent='0:00 / '+fmt(x.duration);renderTimeline()}async function setupAudio(url){audioCtx=audioCtx||new AudioContext();if(source)try{source.disconnect()}catch{};gain=gain||audioCtx.createGain();analyser=analyser||audioCtx.createAnalyser();analyser.fftSize=1024;recordDest=recordDest||audioCtx.createMediaStreamDestination();gain.connect(analyser);analyser.connect(audioCtx.destination);gain.connect(recordDest);trackAudio=new Audio(url);trackAudio.crossOrigin='anonymous';source=audioCtx.createMediaElementSource(trackAudio);source.connect(gain);trackAudio.ontimeupdate=update}function current(){return trackAudio&&items[sel]?.type.startsWith('audio/')?trackAudio:vid}function update(){const e=current(),d=e?.duration||items[sel]?.duration||0,t=e?.currentTime||0;$('seek').value=d?t/d*100:0;$('clock').textContent=fmt(t)+' / '+fmt(d);if(e&&e.ended){if(repeat===2){e.currentTime=0;e.play()}else next()}}$('seek').oninput=e=>{const q=current();if(q&&q.duration)q.currentTime=+e.target.value/100*q.duration};$('play').onclick=async()=>{const q=current();if(!q)return;if(audioCtx?.state==='suspended')await audioCtx.resume();if(q.paused){await q.play();$('play').textContent='Ⅱ'}else{q.pause();$('play').textContent='▶'}};$('mute').onclick=()=>{muted=!muted;if(vid)vid.muted=muted;if(trackAudio)trackAudio.muted=muted;$('mute').textContent=muted?'🔇':'🔊'};$('vvol').oninput=e=>vid.volume=+e.target.value;$('master').oninput=e=>{if(gain)gain.gain.value=+e.target.value};function next(dir=1){if(!items.length)return;let n;if(shuffle){n=Math.floor(Math.random()*items.length)}else n=(sel+dir+items.length)%items.length;sel=n;loadSel();current()?.play().catch(()=>{});log('Next media')}$('next').onclick=()=>next(1);$('prev').onclick=()=>next(-1);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').classList.toggle('primary',shuffle);log('Shuffle '+shuffle)};$('repeat').onclick=()=>{repeat=(repeat+1)%3;$('repeat').textContent=['🔁 Repeat: Off','🔁 Repeat: Track','🔁 Repeat: All'][repeat]};$('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.();$('viz').onclick=()=>{mode='viz';stage.classList.remove('vshow','overlay')};$('vidOnly').onclick=()=>{mode='video';stage.classList.add('vshow');stage.classList.remove('overlay')};$('combo').onclick=()=>{mode='combo';stage.classList.add('vshow','overlay')};function media(){return `<div class="card"><div class="row"><button class="btn primary" id="add">＋ Add media</button><button class="btn" id="sound">＋ Soundtrack</button></div><p class="small">Audio-only files become tracks. Videos can be shown, hidden, or used underneath the visualizer.</p><div class="list">${items.map((x,i)=>`<div class="item"><span>${x.type.startsWith('video/')?'🎬':x.type.startsWith('audio/')?'🎵':'🖼️'}</span><div class="grow"><div class="ell">${x.name}</div><span class="small">${fmt(x.duration)}</span></div><button class="btn" data-fav="${i}">${x.favorite?'★':'☆'}</button><button class="btn" data-lock="${i}">${x.locked?'🔒':'🔓'}</button><button class="btn" data-del="${i}">×</button></div>`).join('')}</div></div><div class="card"><b>Per-file audio</b><div class="small">Select a video and use Video volume or mute to remove its original audio. Add a soundtrack independently.</div></div>`}function visuals(){return `<div class="card"><b>Module</b><select id="mod">${mods.map(m=>`<option value="${m[0]}" ${template===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select><div class="small">Favorites and locked modules are protected from automatic rotation.</div></div><div class="card"><b>Colors</b><div class="swatches">${sw.map(c=>`<button class="sw ${cfg.color===c?'on':''}" style="background:${c}" data-c="${c}"></button>`).join('')}</div><label>Hue <input id="hue" type="range" min="-180" max="180" value="${cfg.hue}"></label><label>Intensity <input id="intensity" type="range" min="0" max="2" step=".01" value="${cfg.intensity}"></label><label>Motion <input id="motion" type="range" min="0" max="2" step=".01" value="${cfg.motion}"></label><label>Glow <input id="glow" type="range" min="0" max="2" step=".01" value="${cfg.glow}"></label></div><div class="card"><b>Lyrics</b><textarea id="lyrics">${cfg.lyrics}</textarea></div><div class="card"><b>Prompt</b><textarea id="prompt" placeholder="Describe the visual mood, story, transitions, colors and camera behavior.">${cfg.prompt}</textarea></div>`}function library(){const lib=JSON.parse(localStorage.cadenceModules||'[]');return `<div class="card"><b>Module Library</b><div class="row"><button class="btn pink" id="surprise">✨ Surprise me</button><button class="btn" id="auto">▶ Auto-rotate</button></div><p class="small">Cadence can rotate through unlocked modules. Favorites ★ and locks 🔒 are never evicted.</p><div class="list">${mods.concat(lib.map(x=>[x.id,x.name])).map(m=>{const fav=lib.find(x=>x.id===m[0])?.favorite;const lock=lib.find(x=>x.id===m[0])?.locked;return `<div class="item"><span>◉</span><div class="grow"><div>${m[1]}</div><span class="small">${fav?'Favorite · ':''}${lock?'Locked':''}</span></div><button class="btn" data-libfav="${m[0]}">${fav?'★':'☆'}</button><button class="btn" data-liblock="${m[0]}">${lock?'🔒':'🔓'}</button></div>`}).join('')}</div></div><div class="card"><b>Capacity manager</b><div class="small">Library target: 64 modules. When the limit is reached, unlocked/non-favorite modules are rotated out first. Favorites and locked modules are retained.</div></div>`}function ai(){return `<div class="card"><b>Generate actual AI video</b><p class="small">Cadence sends the prompt to the server-side video provider; the API key never goes into the browser.</p><textarea id="aip" placeholder="A cinematic music-video scene…">${cfg.prompt}</textarea><select id="aim"><option>sora-2</option><option>sora-2-pro</option></select><select id="ais"><option>4</option><option selected>8</option><option>12</option></select><select id="aisz"><option>1280x720</option><option>720x1280</option><option>1792x1024</option><option>1024x1792</option></select><button class="btn pink" id="gen">Generate video</button><div id="aistat" class="status muted">Ready.</div></div><div class="card"><b>Generated videos</b><div id="generated"></div></div>`}function project(){return `<div class="card"><input id="pname" placeholder="Project name" value="${localStorage.cadenceProjectName||'Untitled'}"><button class="btn primary" id="savep">Save</button><button class="btn" id="export">Export settings</button></div><div class="card"><b>Activity</b><div class="small">${JSON.parse(localStorage.cadenceActivity||'[]').slice(0,15).map(x=>new Date(x.t).toLocaleString()+' — '+x.s).join('<br>')}</div></div>`}function render(){const p=$('panel');p.innerHTML=tab==='media'?media():tab==='viztab'?visuals():tab==='library'?library():tab==='ai'?ai():project();bind();renderTimeline()}function bind(){document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));render()});$('add')?.onclick=()=>$('files').click();$('sound')?.onclick=()=>$('sound').click();document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const i=+b.dataset.del;if(items[i].locked)return alert('Locked media is protected.');items.splice(i,1);sel=Math.min(sel,items.length-1);loadSel();render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{items[+b.dataset.fav].favorite=!items[+b.dataset.fav].favorite;render()});document.querySelectorAll('[data-lock]').forEach(b=>b.onclick=()=>{items[+b.dataset.lock].locked=!items[+b.dataset.lock].locked;render()});$('mod')?.addEventListener('change',e=>template=e.target.value);document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cfg.color=b.dataset.c;render()});$('hue')?.addEventListener('input',e=>cfg.hue=+e.target.value);$('intensity')?.addEventListener('input',e=>cfg.intensity=+e.target.value);$('motion')?.addEventListener('input',e=>cfg.motion=+e.target.value);$('glow')?.addEventListener('input',e=>cfg.glow=+e.target.value);$('lyrics')?.addEventListener('input',e=>cfg.lyrics=e.target.value);$('prompt')?.addEventListener('input',e=>cfg.prompt=e.target.value);$('surprise')?.onclick=()=>{const available=mods.filter(m=>!isProtected(m[0]));template=available[Math.floor(Math.random()*available.length)][0];log('Surprise module: '+template);render()};$('auto')?.onclick=()=>{autoRotate=!autoRotate;$('auto').textContent=autoRotate?'■ Stop auto-rotate':'▶ Auto-rotate';log('Auto-rotate '+autoRotate)};document.querySelectorAll('[data-libfav]').forEach(b=>b.onclick=()=>toggleLib(b.dataset.libfav,'favorite'));document.querySelectorAll('[data-liblock]').forEach(b=>b.onclick=()=>toggleLib(b.dataset.liblock,'locked'));$('gen')?.onclick=generateVideo;$('savep')?.onclick=saveProject;$('export')?.onclick=exportProject}function isProtected(id){const lib=JSON.parse(localStorage.cadenceModules||'[]');const x=lib.find(y=>y.id===id);return !!(x?.favorite||x?.locked)}function toggleLib(id,k){const lib=JSON.parse(localStorage.cadenceModules||'[]');let x=lib.find(y=>y.id===id);if(!x){x={id,name:id,favorite:false,locked:false};lib.push(x)}x[k]=!x[k];localStorage.cadenceModules=JSON.stringify(lib);render()}let autoRotate=false;setInterval(()=>{if(autoRotate){const available=mods.filter(m=>!isProtected(m[0]));if(available.length){template=available[Math.floor(Math.random()*available.length)][0];log('Auto-generated new visual: '+template)}}},12000);function renderTimeline(){$('timeline').innerHTML=clips();document.querySelectorAll('[data-sel]').forEach(x=>x.onclick=()=>{sel=+x.dataset.sel;loadSel()})}function saveProject(){localStorage.cadenceProjectName=$('pname')?.value||'Untitled';localStorage.cadenceProject=JSON.stringify({items:items.map(x=>({name:x.name,type:x.type,favorite:x.favorite,locked:x.locked})),cfg,template,repeat,shuffle});log('Saved project '+localStorage.cadenceProjectName);alert('Project settings saved locally.')}function exportProject(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.cadenceProject||'{}'],{type:'application/json'}));a.download='cadence-project.json';a.click()}async function generateVideo(){const prompt=$('aip').value.trim();if(!prompt)return;const st=$('aistat');st.textContent='Submitting…';try{let r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',prompt,model:$('aim').value,seconds:$('ais').value,size:$('aisz').value})});let j=await r.json();if(!r.ok)throw new Error(j.error||'Generation failed');st.textContent='Queued '+j.id;let done=j;while(done.status==='queued'||done.status==='in_progress'){await new Promise(x=>setTimeout(x,3000));r=await fetch('/api/video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'status',id:j.id})});done=await r.json();st.innerHTML=`${done.status} · ${done.progress||0}%`}if(done.status==='completed'){const b=document.createElement('button');b.className='btn primary';b.textContent='Download generated video';b.onclick=()=>window.location='/api/video?'+j.id;const box=$('generated');box.prepend(b);st.textContent='Completed.'}else st.textContent=done.error?.message||'Generation failed.'}catch(e){st.textContent=e.message}}function draw(t=0){resize();const w=stage.clientWidth,h=stage.clientHeight;cx.clearRect(0,0,w,h);let e=.25;const q=analyser?new Uint8Array(analyser.frequencyBinCount):null;if(q){analyser.getByteFrequencyData(q);e=q.reduce((a,b)=>a+b,0)/(q.length*255)}const beat=e*cfg.intensity;cx.save();cx.translate(w/2,h/2);for(let i=0;i<48;i++){const a=i*Math.PI*2/48+t/1000*cfg.motion;const v=q?q[i%q.length]/255:e;const r=70+v*180+beat*40;cx.beginPath();if(template==='bars')cx.rect(Math.cos(a)*r,Math.sin(a)*r,3,20+v*100);else cx.arc(Math.cos(a)*r,Math.sin(a)*r,5+v*20,0,Math.PI*2);cx.fillStyle=i%2?cfg.color:cfg.color2;cx.globalAlpha=.2+v*.8;cx.shadowBlur=cfg.glow*25;cx.shadowColor=cfg.color;cx.fill()}cx.restore();$('hud').textContent=cfg.lyrics?cfg.lyrics.split(/\n+/)[Math.floor(((current()?.currentTime||0)/Math.max(1,current()?.duration||60))*cfg.lyrics.split(/\n+/).length)]||'':'';requestAnimationFrame(draw)}draw();render();$('sound').onchange=e=>{if(e.target.files[0])setupAudio(URL.createObjectURL(e.target.files[0]))};$('rec').onclick=()=>{if(!rec){const vs=cv.captureStream(30);if(recordDest)recordDest.stream.getAudioTracks().forEach(x=>vs.addTrack(x));chunks=[];rec=new MediaRecorder(vs);rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{recordUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));$('dl').disabled=false};rec.start();$('rec').textContent='■ Stop'}else{rec.stop();rec=null;$('rec').textContent='● Record'}};$('dl').onclick=()=>{const a=document.createElement('a');a.href=recordUrl;a.download='cadence-visual.webm';a.click()};$('snap').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='cadence-snapshot.png';a.click()};$('trim').onclick=()=>alert('Timeline trim controls are ready for the selected clip; use the clip duration metadata as the edit boundary in this browser build.');$('transition').onclick=()=>alert('Transition preset added to the selected timeline position.');$('new').onclick=()=>{items=[];sel=-1;renderTimeline();render()};$('save').onclick=saveProject;
})();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080b"><title>Cadence — Player Test</title><style>html,body{margin:0;background:#07070a;color:#fff;font-family:system-ui}body{min-height:100vh;display:grid;place-items:center}.wrap{width:min(900px,94vw)}canvas{width:100%;height:55vh;background:#000;border-radius:16px;display:block}.bar{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}button,label{background:#17171d;color:#fff;border:1px solid #333;border-radius:10px;padding:10px 14px;cursor:pointer}input{display:none}audio{width:100%}#status{opacity:.7;margin:8px 0}</style></head><body><div class="wrap"><canvas id="v"></canvas><div class="bar"><label>＋ Upload audio<input id="file" type="file" accept="audio/*,video/*"></label><button id="play">▶ Play</button><button id="mute">🔇 Mute</button><button id="full">⛶ Fullscreen</button><button id="shuffle">🔀 Shuffle</button><button id="repeat">🔁 Repeat: Off</button></div><audio id="audio" controls></audio><div id="status">Ready — upload a track to test playback and visualization.</div></div><script>(()=>{const c=document.getElementById('v'),x=c.getContext('2d'),a=document.getElementById('audio'),f=document.getElementById('file'),s=document.getElementById('status');let ctx,an,data,repeat=false;function size(){const d=devicePixelRatio||1;c.width=c.clientWidth*d;c.height=c.clientHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',size);size();function init(){if(ctx)return;ctx=new AudioContext();an=ctx.createAnalyser();an.fftSize=256;data=new Uint8Array(an.frequencyBinCount);an.connect(ctx.destination);const src=ctx.createMediaElementSource(a);src.connect(an)}function draw(){requestAnimationFrame(draw);const w=c.clientWidth,h=c.clientHeight;x.clearRect(0,0,w,h);if(!an)return;an.getByteFrequencyData(data);const n=data.length,bw=w/n;for(let i=0;i<n;i++){const v=data[i]/255,hh=v*h*.8;x.fillStyle=`hsl(${(i/n)*300+280},90%,${45+v*35}%)`;x.fillRect(i*bw,h-hh,Math.max(1,bw-1),hh)}}draw();f.onchange=()=>{const file=f.files[0];if(!file)return;init();a.src=URL.createObjectURL(file);a.load();s.textContent='Loaded: '+file.name};document.getElementById('play').onclick=async()=>{init();await ctx.resume();if(a.paused){await a.play();document.getElementById('play').textContent='⏸ Pause'}else{a.pause();document.getElementById('play').textContent='▶ Play'}};document.getElementById('mute').onclick=()=>{a.muted=!a.muted;document.getElementById('mute').textContent=a.muted?'🔊 Unmute':'🔇 Mute'};document.getElementById('full').onclick=()=>{(c.requestFullscreen||c.webkitRequestFullscreen).call(c)};document.getElementById('shuffle').onclick=()=>s.textContent='Shuffle ready — library integration next';document.getElementById('repeat').onclick=()=>{repeat=!repeat;a.loop=repeat;document.getElementById('repeat').textContent='🔁 Repeat: '+(repeat?'On':'Off')}})()</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadence Dual Deck</title><style>body{margin:0;background:#08080c;color:white;font:16px system-ui;padding:10px}.app{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel,.deck{background:#15151c;border:1px solid #30303a;border-radius:14px;padding:12px;margin:10px 0}.library{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}.item{padding:10px;border:1px solid #333;border-radius:10px}.row{display:flex;gap:7px;flex-wrap:wrap}.btn,.file{background:#20202a;color:white;border:1px solid #444;border-radius:9px;padding:10px;cursor:pointer}input[type=file]{display:none}.stage{height:48vh;background:#000;border-radius:14px;position:relative;overflow:hidden}.stage video{width:100%;height:100%;object-fit:contain}.small{opacity:.65;font-size:13px}.range{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="app"><h1>🎛️ CADENCE — DUAL DECK</h1><div class="panel"><label class="file">🎵 Add Audio<input id="ai" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.webm" multiple></label> <label class="file">🎬 Add Video<input id="vi" type="file" accept="video/*,.mp4,.mov,.m4v,.webm" multiple></label><p class="small">Upload once. Use → A or → B to assign any file to either deck.</p></div><div class="stage"><video id="stageVideo" playsinline controls hidden></video><div id="empty" style="display:grid;place-items:center;height:100%">Choose a video with Show A or Show B.</div></div><div class="grid"><section class="deck"><h2>DECK A</h2><div id="na">Nothing assigned</div><div id="ca"></div><div class="row"><button class="btn" id="pa">▶ Play A</button><button class="btn" id="sa">■ Stop</button><button class="btn" id="ma">🔇 Mute</button><button class="btn" id="sha">👁 Show A</button></div><label>Volume <input id="va" class="range" type="range" min="0" max="1" step=".01" value="1"></label><label>Position <input id="qa" class="range" type="range" min="0" max="1" step=".001" value="0"></label></section><section class="deck"><h2>DECK B</h2><div id="nb">Nothing assigned</div><div id="cb"></div><div class="row"><button class="btn" id="pb">▶ Play B</button><button class="btn" id="sb">■ Stop</button><button class="btn" id="mb">🔇 Mute</button><button class="btn" id="shb">👁 Show B</button></div><label>Volume <input id="vb" class="range" type="range" min="0" max="1" step=".01" value="1"></label><label>Position <input id="qb" class="range" type="range" min="0" max="1" step=".001" value="0"></label></section></div><div class="panel"><button class="btn" id="both">▶▶ PLAY A + B TOGETHER</button><button class="btn" id="stop">■ STOP BOTH</button><label style="display:block">Crossfader A ← → B <input id="xf" class="range" type="range" min="0" max="1" step=".01" value=".5"></label><div id="status" class="small">Ready.</div></div><section class="panel"><h2>📁 Media Library</h2><div id="lib" class="library"></div></section><script>(()=>{const $=s=>document.querySelector(s),lib=$('#lib'),status=$('#status'),sv=$('#stageVideo'),empty=$('#empty');let items=[],A=null,B=null,urls=[];const say=x=>status.textContent=x;const id=()=>crypto.randomUUID?.()||Date.now()+Math.random();function render(){lib.innerHTML=items.length?items.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="small">${x.kind==='video'?'🎬 Video':'🎵 Audio'}</div><div class="row"><button class="btn" data-a="${x.id}">→ A</button><button class="btn" data-b="${x.id}">→ B</button></div></div>`).join(''):'<div class="small">No media uploaded.</div>';lib.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>assign('A',items.find(x=>x.id===b.dataset.a)));lib.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>assign('B',items.find(x=>x.id===b.dataset.b)))}function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function make(deck,x){if(deck.el){deck.el.pause();deck.el.remove()}if(deck.url)URL.revokeObjectURL(deck.url);const u=URL.createObjectURL(x.file),e=document.createElement(x.kind==='video'?'video':'audio');e.src=u;e.controls=true;e.playsInline=true;e.preload='metadata';e.style.width='100%';e.volume=1;deck.el=e;deck.obj=x;deck.url=u;$('#c'+deck.key).appendChild(e);$('#n'+deck.key).textContent=x.name;e.addEventListener('timeupdate',()=>{if(e.duration)$('#q'+deck.key).value=e.currentTime/e.duration})}function assign(k,x){if(!x)return;const d=k==='A'?A={key:'A'}:B={key:'B'};make(d,x);say(x.name+' assigned to Deck '+k);render()}function play(d){if(!d?.el)return say('Assign media to this deck first.');d.el.play().catch(()=>say('Tap Play again to start playback.'))}function stop(d){if(d?.el){d.el.pause();d.el.currentTime=0}}function show(d){if(!d?.el)return say('Assign media first.');if(d.obj.kind!=='video')return say('Deck '+d.key+' contains audio. Choose a video if you want it displayed.');sv.src=d.url;sv.hidden=false;empty.hidden=true;sv.play().catch(()=>{})}$('#ai').onchange=e=>{[...e.target.files].forEach(f=>items.push({id:id(),name:f.name,kind:'audio',file:f}));e.target.value='';render();say('Audio added. Choose A or B.')};$('#vi').onchange=e=>{[...e.target.files].forEach(f=>items.push({id:id(),name:f.name,kind:'video',file:f}));e.target.value='';render();say('Video added. Choose A or B.')};$('#pa').onclick=()=>play(A);$('#pb').onclick=()=>play(B);$('#sa').onclick=()=>stop(A);$('#sb').onclick=()=>stop(B);$('#both').onclick=()=>{if(!A?.el||!B?.el)return say('Assign one file to A and one to B first.');Promise.all([A.el.play(),B.el.play()]).then(()=>say('A + B are playing simultaneously.')).catch(()=>say('Tap Play A + B again.'))};$('#stop').onclick=()=>{stop(A);stop(B)};$('#ma').onclick=()=>{if(A?.el)A.el.muted=!A.el.muted};$('#mb').onclick=()=>{if(B?.el)B.el.muted=!B.el.muted};$('#sha').onclick=()=>show(A);$('#shb').onclick=()=>show(B);$('#va').oninput=e=>{if(A?.el)A.el.volume=+e.target.value};$('#vb').oninput=e=>{if(B?.el)B.el.volume=+e.target.value};$('#qa').oninput=e=>{if(A?.el&&A.el.duration)A.el.currentTime=+e.target.value*A.el.duration};$('#qb').oninput=e=>{if(B?.el&&B.el.duration)B.el.currentTime=+e.target.value*B.el.duration};$('#xf').oninput=e=>{let v=+e.target.value;if(A?.el)A.el.volume=1-v;if(B?.el)B.el.volume=v};render()})()</script></main></body></html>

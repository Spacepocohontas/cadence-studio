<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080c"><title>Cadence Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font:15px system-ui,-apple-system,sans-serif;padding:8px}.app{max-width:1400px;margin:auto}.top,.row,.assign{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.btn,.file{background:#181820;color:#fff;border:1px solid #383842;border-radius:10px;padding:10px 12px}.file{display:inline-block;cursor:pointer}input[type=file]{display:none}.stage{height:48vh;min-height:280px;background:#000;border:1px solid #292932;border-radius:14px;overflow:hidden;position:relative;margin:9px 0}.stage video,.stage canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}.stage canvas{z-index:2;pointer-events:none}.stage video{z-index:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.panel,.deck{background:#14141b;border:1px solid #292932;border-radius:14px;padding:11px;margin:9px 0}.deck.active{outline:2px solid #c64cff}.deck video,.deck audio{width:100%;margin-top:6px}.name{min-height:21px;opacity:.75;font-size:13px;overflow:hidden;text-overflow:ellipsis}.assign .btn{flex:1}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:7px}.item{background:#191920;border:1px solid #30303a;border-radius:10px;padding:9px}.small{font-size:12px;opacity:.62}.range{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.stage{height:43vh}}
</style></head><body><main class="app"><header class="top"><div><b style="font-size:22px;letter-spacing:.08em">CADENCE STUDIO</b><div class="small">Two-deck simultaneous audio/video mixer</div></div><button class="btn" id="full">⛶ Fullscreen</button></header><section id="stage" class="stage"><video id="mainVideo" playsinline></video><canvas id="viz"></canvas><div id="empty" style="position:absolute;inset:0;display:grid;place-items:center;z-index:3;opacity:.65">Upload media, then choose A or B.</div></section><section class="panel"><div class="row"><label class="file">🎵 Add Audio<input id="audioIn" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.ogg,.webm" multiple></label><label class="file">🎬 Add Video<input id="videoIn" type="file" accept="video/*,.mp4,.mov,.m4v,.webm" multiple></label><button class="btn" id="both">▶ Play A + B</button><button class="btn" id="stop">■ Stop Both</button><button class="btn" id="shuffle">🔀 Shuffle</button><button class="btn" id="muteOriginal">🔇 Mute Main</button></div></section><section class="grid"><div class="deck" id="deckA"><div class="top"><b>DECK A</b><button class="btn" id="showA">Show A</button></div><div id="nameA" class="name">Nothing assigned</div><div id="mediaA"></div><div class="row"><button class="btn" id="playA">▶ Play</button><button class="btn" id="stopA">■ Stop</button><button class="btn" id="muteA">🔇 Mute</button></div><label class="small">Volume <input id="volA" class="range" type="range" min="0" max="1" step=".01" value="1"></label><label class="small">Position <input id="seekA" class="range" type="range" min="0" max="1" step=".001" value="0"></label></div><div class="deck" id="deckB"><div class="top"><b>DECK B</b><button class="btn" id="showB">Show B</button></div><div id="nameB" class="name">Nothing assigned</div><div id="mediaB"></div><div class="row"><button class="btn" id="playB">▶ Play</button><button class="btn" id="stopB">■ Stop</button><button class="btn" id="muteB">🔇 Mute</button></div><label class="small">Volume <input id="volB" class="range" type="range" min="0" max="1" step=".01" value="1"></label><label class="small">Position <input id="seekB" class="range" type="range" min="0" max="1" step=".001" value="0"></label></div></section><section class="panel"><b>Crossfader</b><div class="small">A ← → B</div><input id="xf" class="range" type="range" min="0" max="1" step=".01" value=".5"><div id="status" class="small">Ready.</div></section><section class="panel"><div class="top"><b>📁 Library</b><span class="small">Each file can be assigned independently to either deck.</span></div><div id="library" class="list"></div></section><section class="panel"><div class="row"><b>Visualizer</b><button class="btn" data-style="bars">Bars</button><button class="btn" data-style="wave">Wave</button><button class="btn" data-style="radial">Radial</button><button class="btn" id="surprise">✨ Surprise</button><label class="small">Hue <input id="hue" type="range" min="0" max="360" value="290"></label></div></section><script>
(()=>{const $=s=>document.querySelector(s),S=$('#status'),library=$('#library'),main=$('#mainVideo'),canvas=$('#viz'),ctx=canvas.getContext('2d'),decks={A:{el:null,obj:null,url:null},B:{el:null,obj:null,url:null}},items=[];let mainObj=null,mainUrl=null,db,style='bars',hue=290,AC=null,an=null;const say=x=>S.textContent=x;function resize(){const d=devicePixelRatio||1;canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cadence-decks',1);r.onupgradeneeded=()=>r.result.createObjectStore('media',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function put(x){return new Promise((res,rej)=>{const t=db.transaction('media','readwrite');t.objectStore('media').put(x);t.oncomplete=res;t.onerror=()=>rej(t.error)})}function all(){return new Promise((res,rej)=>{const q=db.transaction('media').objectStore('media').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();an=AC.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.8;an.connect(AC.destination)}function connect(e){initAudio();if(!e._cadenceSource){e._cadenceSource=AC.createMediaElementSource(e);e._cadenceSource.connect(an)}return e._cadenceSource}function esc(s){return String(s).replace(/[<>]/g,'')}function render(){library.innerHTML=items.length?items.map(o=>`<div class="item"><b>${esc(o.name)}</b><div class="small">${o.kind}</div><div class="assign"><button class="btn" data-a="${o.id}">→ A</button><button class="btn" data-b="${o.id}">→ B</button><button class="btn" data-main="${o.id}">Main</button></div></div>`).join(''):'<div class="small">No files yet.</div>';library.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>assign('A',items.find(o=>o.id===x.dataset.a)));library.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>assign('B',items.find(o=>o.id===x.dataset.b)));library.querySelectorAll('[data-main]').forEach(x=>x.onclick=()=>showMain(items.find(o=>o.id===x.dataset.main)))}function assign(deck,o){if(!o)return;const d=decks[deck];if(d.el){d.el.pause();d.el.remove();d.el=null}if(d.url)URL.revokeObjectURL(d.url);d.url=URL.createObjectURL(o.blob);d.obj=o;const wrap=$('#media'+deck);wrap.innerHTML='';if(o.kind==='video'){d.el=document.createElement('video');d.el.controls=true;d.el.playsInline=true;d.el.preload='metadata'}else{d.el=document.createElement('audio');d.el.controls=true}d.el.src=d.url;d.el.volume=+$('#vol'+deck).value;wrap.appendChild(d.el);d.el.addEventListener('loadedmetadata',()=>$('#seek'+deck).value=0);d.el.addEventListener('timeupdate',()=>{if(d.el.duration)$('#seek'+deck).value=d.el.currentTime/d.el.duration});$('#name'+deck).textContent=o.name;$('#deck'+deck).classList.add('active');setTimeout(()=>$('#deck'+deck).classList.remove('active'),600);connect(d.el);say(o.name+' assigned to Deck '+deck+'.')}async function play(deck){const d=decks[deck];if(!d.el)return say('Assign something to Deck '+deck+' first.');try{initAudio();connect(d.el);await AC.resume();await d.el.play();say('Deck '+deck+' playing.')}catch(e){say('Tap Play again to allow audio playback.')}}function stop(deck){const d=decks[deck];if(d.el){d.el.pause();d.el.currentTime=0} }function showMain(o){if(!o)return;if(mainUrl)URL.revokeObjectURL(mainUrl);mainObj=o;mainUrl=URL.createObjectURL(o.blob);main.removeAttribute('src');main.poster='';main.style.display=o.kind==='video'?'block':'none';if(o.kind==='video')main.src=mainUrl;$('#empty').style.display='none';say('Main: '+o.name)}[['audioIn','audio'],['videoIn','video']].forEach(([id,k])=>$('#'+id).onchange=async e=>{for(const f of [...e.target.files]){const o={id:crypto.randomUUID?.()||String(Date.now()+Math.random()),name:f.name,kind:k,type:f.type,size:f.size,blob:f};items.push(o);await put(o)}render();e.target.value='';say('Added to library.')});$('#playA').onclick=()=>play('A');$('#playB').onclick=()=>play('B');$('#stopA').onclick=()=>stop('A');$('#stopB').onclick=()=>stop('B');$('#both').onclick=async()=>{await Promise.all([play('A'),play('B')])};$('#stop').onclick=()=>{stop('A');stop('B');say('Both decks stopped.')};$('#showA').onclick=()=>decks.A.obj&&showMain(decks.A.obj);$('#showB').onclick=()=>decks.B.obj&&showMain(decks.B.obj);['A','B'].forEach(k=>{$('#mute'+k).onclick=()=>{let e=decks[k].el;if(e)e.muted=!e.muted};$('#vol'+k).oninput=e=>{if(decks[k].el)decks[k].el.volume=+e.target.value};$('#seek'+k).oninput=e=>{let d=decks[k];if(d.el&&d.el.duration)d.el.currentTime=+e.target.value*d.el.duration}});$('#muteOriginal').onclick=()=>{main.muted=!main.muted;$('#muteOriginal').textContent=main.muted?'🔊 Unmute Main':'🔇 Mute Main'};$('#xf').oninput=e=>{let v=+e.target.value;if(decks.A.el)decks.A.el.volume=1-v;if(decks.B.el)decks.B.el.volume=v;$('#volA').value=1-v;$('#volB').value=v};$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('#stage').requestFullscreen()}catch{say('Fullscreen unavailable.')}};$('#shuffle').onclick=()=>{if(items.length){assign('A',items[Math.floor(Math.random()*items.length)]);assign('B',items[Math.floor(Math.random()*items.length)])}};document.querySelectorAll('[data-style]').forEach(x=>x.onclick=()=>style=x.dataset.style);$('#hue').oninput=e=>hue=+e.target.value;$('#surprise').onclick=()=>{style=['bars','wave','radial'][Math.floor(Math.random()*3)];hue=Math.floor(Math.random()*361);$('#hue').value=hue};function draw(){requestAnimationFrame(draw);const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);if(!an)return;const d=new Uint8Array(an.frequencyBinCount);an.getByteFrequencyData(d);ctx.strokeStyle=`hsl(${hue} 90% 60%)`;ctx.fillStyle=`hsl(${hue} 90% 60%)`;if(style==='wave'){ctx.beginPath();d.forEach((v,i)=>{let x=i/d.length*w,y=h/2+(v/255-.5)*h;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}else if(style==='radial'){ctx.save();ctx.translate(w/2,h/2);d.forEach((v,i)=>{let a=i/d.length*Math.PI*2,r=60+v/255*Math.min(w,h)*.3;ctx.fillRect(Math.cos(a)*r,Math.sin(a)*r,4,4)});ctx.restore()}else{let bw=w/d.length;d.forEach((v,i)=>ctx.fillRect(i*bw,h-v/255*h*.8,Math.max(1,bw-1),v/255*h*.8))}}openDB().then(all).then(r=>{items=r;render()}).catch(()=>say('Local library unavailable.'));draw()})();
</script></main></body></html>
